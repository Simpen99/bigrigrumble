<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Big Rig Rumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#9fd4f5; --yellow:#FFC83D; --yellow-dk:#E0A800; --sign:#0E7A55; --red:#E5484D; --blue:#2F7DE1; --purple:#8E5BE0; --green:#1FA35C;
  --ink:#151B24; --muted:#5B6576; --panel:#FFFFFF; --panel2:#F1F4F8; --line:rgba(21,27,36,.12); --shadow:0 10px 30px rgba(10,20,40,.18);
  --hud:rgba(16,22,31,.84); --hud2:rgba(255,255,255,.08); --hudline:rgba(255,255,255,.12);
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#EEF3F8;--muted:#9AA6B7;--panel:#18212C;--panel2:#212C39;--line:rgba(255,255,255,.1);--shadow:0 10px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--ink:#EEF3F8;--muted:#9AA6B7;--panel:#18212C;--panel2:#212C39;--line:rgba(255,255,255,.1);--shadow:0 10px 30px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:#7FBF6A;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
#app{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:0 12px 24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
p{line-height:1.45;margin:0}
.stage{height:40vh;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;padding:14px 4px 10px;pointer-events:none}
.stage.short{height:30vh;min-height:190px}
.stage.tall{height:58vh;min-height:320px}
.brand{font-family:var(--display);font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:28px;height:10px;border-radius:5px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 6px,#151B24 6px 12px)}
.showname{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;pointer-events:auto}
.showname h2{font-size:clamp(28px,8vw,40px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3)}
.showname p{color:#fff;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.5);font-size:14px;margin-top:4px}
.arrows{display:flex;gap:8px}
.arr{width:44px;height:44px;border-radius:50%;border:0;background:rgba(16,22,31,.6);color:#fff;font-size:22px;font-weight:800;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{background:var(--panel);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-top:10px}
.sheet h2{font-size:18px;margin-bottom:10px}
.sheet+.sheet{margin-top:12px}
label.field{display:block;font-weight:700;font-size:14px;color:var(--muted)}
label.field input,select.inp{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:17px;background:var(--panel2);color:var(--ink)}
.carousel{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -4px}
.carousel::-webkit-scrollbar{display:none}
.tc{flex:none;width:96px;scroll-snap-align:start;border:2px solid transparent;border-radius:14px;background:var(--panel2);padding:4px 4px 6px;text-align:center}
.tc img{width:100%;height:62px;object-fit:contain;display:block}
.tc span{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc.sel{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 22%,var(--panel2))}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 16px;font-family:var(--display);font-size:17px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:var(--yellow);color:#151B24}
.btn.sign{background:var(--sign);color:#fff}
.btn.ghost{background:var(--panel2);color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;box-shadow:none}
.btn.red{background:var(--red);color:#fff}
.btn.small{padding:10px 12px;font-size:14px;width:auto}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack>*+*{margin-top:10px}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:8px}
.maprules{padding-left:18px}.maprules li{margin-top:3px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--panel2)}
.status b{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block}
.status.ok b{background:var(--green)}.status.bad b{background:var(--red)}.status.wait b{background:var(--yellow)}
.qrbox{display:flex;gap:14px;align-items:center}
.qr{background:#fff;padding:8px;border-radius:14px;flex:none;width:150px;height:150px;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.qr img,.qr canvas{width:134px!important;height:134px!important}
.code{font-family:var(--display);font-size:30px;letter-spacing:4px}
.linkline{font-size:12px;word-break:break-all;color:var(--muted);margin-top:8px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist img{width:58px;height:40px;object-fit:contain;flex:none}
.plist .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.plist .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.xbtn{border:0;background:var(--panel2);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 0;font-weight:800;font-size:16px;border-radius:9px}
.seg button.on{background:var(--yellow);color:#151B24}
.gamebtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:0;border-radius:14px;padding:10px;margin-bottom:8px}
.gamebtn img{width:70px;height:48px;object-fit:contain;flex:none}
.gamebtn .code{font-size:18px;letter-spacing:2px;margin-left:auto}
.empty{padding:14px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;font-size:14px;line-height:1.45}
.banner{background:var(--red);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;margin-top:10px;font-size:14px}
.diag{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.diag code{background:var(--panel2);padding:1px 5px;border-radius:5px}
details.how summary{font-family:var(--display);font-size:17px;cursor:pointer}
details.how ul{padding-left:18px;margin:10px 0 0}details.how li{margin:6px 0;line-height:1.45;font-size:15px}
.localform{background:var(--panel2);border-radius:14px;padding:12px;margin-top:10px}
/* HUD */
.hudtop{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;gap:8px;align-items:center;max-width:560px;margin:0 auto;pointer-events:none}
.hudtop>*{pointer-events:auto}
.vol{display:flex;flex-direction:column;gap:8px}
.volrow{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.volrow span{flex:none;width:92px}
.volrow input{flex:1;min-width:0;accent-color:#FFC83D;height:28px}
.volbox{padding:4px 2px}
.volpop{position:fixed;right:10px;z-index:30;width:min(300px,calc(100vw - 20px));background:var(--hb,rgba(24,32,50,.94));color:#fff;border:3px solid #F4F6F9;border-radius:16px;padding:12px 14px;box-shadow:0 5px 0 var(--ledge,rgba(11,14,20,.85));font-family:var(--display);display:flex;flex-direction:column;gap:10px}
body.tv .volpop{zoom:1.5}
.chip{background:var(--hud);color:#fff;border-radius:999px;padding:8px 13px;font-weight:800;font-size:14px;white-space:nowrap;border:1px solid var(--hudline);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip.grow{flex:1;overflow:hidden;text-overflow:ellipsis;min-width:0}
button.chip{border:1px solid var(--hudline)}
.hudbot{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:560px;margin:0 auto;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none}
.hudbot>*{pointer-events:auto}
.hcard{background:var(--hud);color:#fff;border-radius:20px;border:1px solid var(--hudline);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.msg{padding:11px 14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--hudline);display:flex;gap:10px;align-items:center;min-height:46px}
.msg i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.pan{padding:12px 14px}
.pan h3{font-size:17px;margin-bottom:8px;color:var(--yellow)}
.pan p{color:#dfe6ef;font-size:15px}
/* dice picker (pickHTML): over the 3D die, placed by stepPick (translate = the die's centre, --r = 0.9 m on screen); .flat = in a TV controller's card */
.dpick{position:fixed;left:0;top:0;z-index:4;width:0;height:0;pointer-events:none;--r:60px}
.dpick[hidden]{display:none}
.dpick:not(.flat):not(.in){visibility:hidden}
.dpick>*{position:absolute;pointer-events:auto}
.dp-die{left:calc(var(--r) * -1.35);top:calc(var(--r) * -1);width:calc(var(--r) * 2.7);height:calc(var(--r) * 2.9);border:0;padding:0;border-radius:40%;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dpick .mm-arr{top:-24px;width:48px;height:48px}
.dpick .mm-arr.l{right:calc(var(--r) * 1.45)}
.dpick .mm-arr.r{left:calc(var(--r) * 1.45)}
.dp-info{pointer-events:none!important;left:0;bottom:calc(var(--r) * .9);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px}
.dp-info b{font:400 15px/1 var(--display);color:#fff;background:var(--hb,#1B2333);border:2.5px solid #151B24;border-radius:999px;padding:5px 12px 4px;white-space:nowrap;box-shadow:0 3px 0 var(--ledge,#0B0E14);animation:mmSwap .25s cubic-bezier(.2,1.5,.4,1) both}
.dp-info small{font:700 12px/1.25 var(--body);color:#fff;background:rgba(21,27,36,.82);border-radius:10px;padding:4px 9px;width:max-content;max-width:190px;text-align:center}
/* the die's six faces in a row under it while picking (facesHTML): white tiles framed in the die's colour, yellow numbers, coin pills */
.dp-faces{pointer-events:none!important;left:0;top:calc(var(--r) * 1.1);transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--hb,#1B2333);border:2.5px solid #151B24;border-radius:12px;box-shadow:0 3px 0 var(--ledge,#0B0E14)}
.dp-faces i{animation:dpIn .25s ease-out backwards;position:relative;width:30px;height:33px;box-sizing:border-box;border:3px solid var(--dc);border-radius:7px;background:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:400 19px/1 var(--display);font-style:normal;color:#FFC83D;text-shadow:1.5px 0 0 #3A2A12,-1.5px 0 0 #3A2A12,0 1.5px 0 #3A2A12,0 -1.5px 0 #3A2A12,1px 1px 0 #3A2A12,-1px 1px 0 #3A2A12,1px -1px 0 #3A2A12,-1px -1px 0 #3A2A12}
@keyframes dpIn{from{opacity:0;transform:translateY(-6px)}}
.dp-faces i b{font:800 9px/1 var(--body);color:#fff;background:#1FA35C;border-radius:99px;padding:1px 3px;text-shadow:none}
.dp-faces i b.neg{background:#E5484D}
.dpick.flat{position:static;width:auto;height:auto;display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;gap:8px;margin-top:8px;pointer-events:auto}
.dpick.flat>*{position:relative}
.dpick.flat .mm-arr{grid-row:1;top:auto;left:auto;right:auto;width:56px;height:56px}
.dpick.flat .mm-arr.l{grid-column:1}
.dpick.flat .mm-arr.r{grid-column:3}
.dpick.flat .dp-die{grid-column:2;grid-row:1;align-self:stretch;left:auto;top:auto;width:100%;height:auto;border-radius:16px;background:var(--yellow);border:2.5px solid #151B24;box-shadow:0 4px 0 var(--ledge,#0B0E14)}
.dpick.flat .dp-die:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ledge,#0B0E14)}
.dpick.flat .dp-info{grid-column:2;grid-row:1;left:auto;bottom:auto;transform:none;padding:16px 6px 18px;z-index:1}
.dpick.flat .dp-info small{background:none;color:#151B24;padding:0;width:auto;max-width:none}
.dpick.flat .dp-faces{grid-column:1/-1;grid-row:2;left:auto;top:auto;transform:none;justify-self:center}
.dpick.flat .dp-info b{background:none;border:0;box-shadow:none;color:#151B24;font-size:20px;padding:0}
/* board player panels: the designer's panel art recoloured beige (art/ui/panel-beige, from art/ui-navy/panel-navy by tools/recolor.mjs) so the icons pop; dark text, every slot placed in % of the 1873 x 586 art and sized in cqw; whose move it is (.now) pops out a little with an octagon pulsing out of its own */
.pstrip{position:fixed;z-index:4;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 50px);max-width:560px;margin:0 auto;padding:0 10px;display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;align-content:start;pointer-events:none;transition:opacity .4s}
.pstrip>*{grid-column:var(--sc);grid-row:var(--sr);min-width:0}
.pc{position:relative;aspect-ratio:1873/586;container-type:inline-size;color:#3A2812;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transform-origin:0 50%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.pc::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--ui-panel-beige) center/100% 100% no-repeat}
.pc.now{transform:scale(1.06)}
/* whose move it is: a beige octagon pulsing out of the octagon (pcardHTML adds it) */
.pc-rip{position:absolute;inset:-18%;pointer-events:none;background:center/100% 100% no-repeat}
.pc-rip{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cpolygon points=%2294,50 81.1,81.1 50,94 18.9,81.1 6,50 18.9,18.9 50,6 81.1,18.9%22 fill=%22none%22 stroke=%22%233E2C1A%22 stroke-width=%226%22 stroke-linejoin=%22round%22/%3E%3Cpolygon points=%2294,50 81.1,81.1 50,94 18.9,81.1 6,50 18.9,18.9 50,6 81.1,18.9%22 fill=%22none%22 stroke=%22%23E6D7B4%22 stroke-width=%223.4%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E");animation:pcRip 1.6s ease-out infinite}
@keyframes pcRip{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.pc-rip{animation-iteration-count:1}}
.pc>*{position:absolute}
.pc-oct{left:1.3%;top:19.1%;width:24.4%;height:75.9%}
.pc-oct::before{content:"";position:absolute;inset:0;clip-path:polygon(100% 50%,85.36% 85.36%,50% 100%,14.64% 85.36%,0 50%,14.64% 14.64%,50% 0,85.36% 14.64%);background:radial-gradient(circle at 50% 26%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%),linear-gradient(rgba(0,0,0,0) 55%,rgba(0,0,0,.28)),var(--c)}
.pc-oct img{position:absolute;left:-7%;top:12%;width:114%;height:76%;object-fit:contain}
.pc-oct em{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);font:400 4.2cqw/1 var(--display);background:#151B24;color:#fff;border:.5cqw solid #fff;border-radius:99px;padding:.8cqw 1.5cqw .5cqw;white-space:nowrap}
.pc-nm{left:39.8%;width:35.2%;top:4.6%;height:19.6%;font:400 clamp(3.2cqw,calc(44cqw / var(--nl,8)),5.4cqw)/6.1cqw var(--display);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .3cqw 0 rgba(255,255,255,.55)}
.pc-it{inset:0}
.pc-it span{position:absolute;top:39.6%;width:8.4%;height:33.3%;display:grid;place-items:center;font-size:5.6cqw;line-height:1}
.pc-it span:nth-child(1){left:31.4%}
.pc-it span:nth-child(2){left:42.4%}
.pc-it span:nth-child(3){left:53.8%}
.pc .stats{left:64.4%;width:33.6%;top:32.8%;height:47.8%;display:grid;align-content:center;justify-content:center;gap:.6cqw 2.4cqw;font:400 6.4cqw/1 var(--display);color:#3A2812;text-shadow:0 .3cqw 0 rgba(255,255,255,.55)}
.pc .stats.four{grid-template-columns:auto auto;font-size:4.8cqw}
.pc .stats span{display:flex;align-items:center;gap:.7cqw}
.pc .stats .ico{width:1.25em;height:1.25em}
.pc-up{left:79.3%;top:0;width:19%;height:26%;display:flex;align-items:center;justify-content:center;gap:.6cqw;font-size:4.8cqw;line-height:1}
.pc-off{left:4%;top:7%;font:800 3.6cqw/1 var(--body);background:var(--red);color:#fff;border-radius:99px;padding:.7cqw 1.5cqw}
.pc.off .pc-oct img{opacity:.45}
/* right-hand corners: the art mirrored, every slot measured from the right instead */
.pc.flip{transform-origin:100% 50%}
.pc.flip.now{transform:scale(1.06)}
.pc.flip::before{transform:scaleX(-1)}
.pc.flip .pc-oct{left:auto;right:1.3%}
.pc.flip .pc-nm{left:auto;right:39.8%}
.pc.flip .pc-it span:nth-child(1){left:auto;right:31.4%}
.pc.flip .pc-it span:nth-child(2){left:auto;right:42.4%}
.pc.flip .pc-it span:nth-child(3){left:auto;right:53.8%}
.pc.flip .stats{left:auto;right:64.4%}
.pc.flip .pc-up{left:auto;right:79.3%}
.pc.flip .pc-off{left:auto;right:4%}
.teamc{display:flex;align-items:center;justify-content:space-between;gap:8px;align-self:center;background:var(--hb,#1B2333);border:2.5px solid var(--tc);border-radius:12px;padding:3px 10px 2px;color:#fff;box-shadow:0 3px 0 var(--ledge,#0B0E14);font:400 13px/1.2 var(--display)}
.teamc b{font-weight:400;color:var(--tc)}
.teamc .stats{display:flex;gap:8px}
.teamc .stats span{display:inline-flex;align-items:center;gap:2px}
body.mglive .pstrip,body.mgres .pstrip{display:none}
body.trout .pstrip{opacity:0}
/* one panel in every corner (stripHTML: #pstrip = the top corners, #pstripb = the bottom ones); portrait: under the top chips and just above the card (--hbh) */
@media (orientation:portrait){body:not(.ctl) .dlabel{top:calc(env(safe-area-inset-top,0px) + 58px + var(--psh,0px))}}
/* portrait: the top panels go under the round counter's rock */
@media (orientation:portrait){body:not(.ctl) .pstrip:not(.bot){top:calc(env(safe-area-inset-top,0px) + 72px)}}
.pstrip.bot{top:auto;bottom:calc(var(--hbh,120px) + 2px);align-content:end}
/* phone on its side: the corners, the top chips and the card between them */
@media (orientation:landscape) and (max-height:500px){
  :root{--pw:min(172px,21vw);--pl:max(10px,env(safe-area-inset-left,0px));--pr:max(10px,env(safe-area-inset-right,0px))}
  .pstrip{left:var(--pl);right:var(--pr);top:calc(env(safe-area-inset-top,0px) + 8px);max-width:none;margin:0;padding:0;grid-template-columns:var(--pw) var(--pw);justify-content:space-between;gap:4px}
  .pstrip.bot{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}

.pt .btn.small{padding:9px 14px;font-size:13px;width:auto}
.pt .btn.small::before{border-width:2px}
.pt .stack>*+*{margin-top:12px}
.pt .tc{border:2.5px solid rgba(244,246,249,.28);border-radius:12px;background:var(--hb2);padding:4px 4px 6px;transition:transform .1s}

.pt .tc.sel{border-color:#151B24;background:var(--yellow);box-shadow:0 4px 0 var(--ledge);transform:translateY(-2px)}
.pt .tc.sel span{color:#151B24}
.pt .carousel{padding:6px 6px 10px}
.pt .arr{border:3px solid #151B24;border-radius:10px;background:var(--yellow);color:#151B24;font-family:var(--display);font-weight:400;box-shadow:0 4px 0 var(--ledge);transform:skewX(-9deg);-webkit-backdrop-filter:none;backdrop-filter:none}
.pt .arr:active{transform:skewX(-9deg) translateY(3px);box-shadow:0 1px 0 var(--ledge)}
.pt .showname h2{text-transform:uppercase;-webkit-text-stroke:2px #151B24;paint-order:stroke fill;text-shadow:0 4px 0 #151B24}
.pt .showname p{text-shadow:0 1px 0 #151B24,0 1px 8px rgba(0,0,0,.45)}
.pt label.field{font-family:var(--display);font-weight:400;font-size:13px;text-transform:uppercase;color:var(--muted)}
.pt label.field input{border:2.5px solid rgba(244,246,249,.28);border-radius:10px;background:var(--hb2);color:#fff;font-family:var(--body);font-weight:700}
.pt details.how summary{font-size:18px;text-transform:uppercase;text-shadow:var(--ts)}
.pt .volrow{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:13px}
.pt .status{background:var(--hb2);color:#fff}
.pt .brand{position:relative;isolation:isolate;align-self:flex-start;margin:4px 0 0 6px;padding:7px 22px;font-size:22px;color:#151B24;text-transform:uppercase;text-shadow:none}
.pt .brand i{display:none}
.pt .brand::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--yellow);border:3px solid #151B24;border-radius:9px;box-shadow:var(--hs);transform:skewX(-12deg)}
.pt .seg{background:rgba(11,14,20,.35);border-radius:12px}
.pt .seg button{font-family:var(--display);font-weight:400;font-size:15px;color:#fff;border:2.5px solid transparent}

.pt .mapb,.pt .pgame,.pt .gamebtn{color:#fff;background:var(--hb2);border:2.5px solid rgba(244,246,249,.28);border-radius:12px;box-shadow:0 3px 0 var(--ledge)}
.pt .mapb.on{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 22%,var(--hb2))}
.pt .pgame:active,.pt .gamebtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ledge)}
.pt .gamebtn b{font-family:var(--display);font-weight:400}
.pt .code{color:var(--yellow);text-shadow:var(--ts)}
.pt .xbtn{color:#fff;background:var(--hb2);border:2px solid rgba(244,246,249,.28)}
.pt .empty{border-color:rgba(244,246,249,.25)}
.pt .localform{background:rgba(11,14,20,.3)}
.pt select.inp{border:2.5px solid rgba(244,246,249,.28);border-radius:10px;background:var(--hb2);color:#fff}
/* main menu (#app.mm = the home view, design_handoff_main_menu): authored at 1280 x 720. Landscape: each group is fixed to a corner and zoomed by --mz = min(width / 1280, height / 720) (offsets zoom with it; --sl / --sr / --sb / --st add the safe areas back unzoomed). Portrait: the same groups stacked, zoomed to the width by --mzp. Art from UI_ART as --ui-<name>. Button labels sit on the middle of the raised face (measured from the art: yellow, green and white faces are centred, the dark ones sit 3.8% low), trimmed to the cap height. Ink #2a2433, label #8a7f6c, cost red #d32d22, focus yellow #ffcc30 */
#app.mm{--bsh:drop-shadow(0 3px 6px rgba(20,16,28,.28));max-width:none;margin:0;padding:0;--sl:calc(env(safe-area-inset-left,0px) / var(--mz,1));--sr:calc(env(safe-area-inset-right,0px) / var(--mz,1));--sb:calc(env(safe-area-inset-bottom,0px) / var(--mz,1));--st:calc(env(safe-area-inset-top,0px) / var(--mz,1))}
#app.mm::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(270deg,rgba(24,32,50,.35),rgba(24,32,50,0) 55%)}
.mm .mmg{position:fixed;zoom:var(--mz,1)}
.mm-logo{left:calc(34px + var(--sl));top:calc(20px + var(--st));width:200px;aspect-ratio:720/378;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));animation:mmLogo .8s cubic-bezier(.2,1.5,.4,1) both;pointer-events:none}
@keyframes mmLogo{from{opacity:0;transform:translateY(-30px) scale(.7)}to{opacity:1;transform:none}}
.mm-top{right:calc(30px + var(--sr));top:calc(26px + var(--st));display:flex;gap:10px;align-items:center}
.mm-info{left:calc(106px + var(--sl));top:calc(518px + var(--st));width:488px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;pointer-events:none}
.mm-nrow{display:flex;align-items:baseline;justify-content:center;gap:12px}
.mm-idx{font:14px/1 "Lilita One",sans-serif;letter-spacing:2px;color:#ffcc30;text-shadow:0 2px 0 #2a2433,1.5px 0 0 #2a2433,-1.5px 0 0 #2a2433,0 -1.5px 0 #2a2433;animation:mmSwap .25s cubic-bezier(.2,1.5,.4,1) both}
/* the arrows either side of the 3D truck (landscape; the camera centres the truck on this strip, GFX.menuCx / menuCy) */
.mm-stage{left:calc(25px + var(--sl));top:calc(329px + var(--st));width:651px;display:flex;justify-content:space-between;pointer-events:none}
.mm-stage .mm-arr{pointer-events:auto}
.mm-plate .mm-arr{display:none}
.mm-name{font:48px/1 "Lilita One",sans-serif;letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:0 5px 0 #2a2433,2px 0 0 #2a2433,-2px 0 0 #2a2433,0 -2px 0 #2a2433,2px 2px 0 #2a2433,-2px 2px 0 #2a2433,2px -2px 0 #2a2433,-2px -2px 0 #2a2433;animation:mmSwap .25s cubic-bezier(.2,1.5,.4,1) both}
.mm-tag{font:600 16px Rubik,sans-serif;line-height:1.3;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);animation:mmSwap .25s .03s cubic-bezier(.2,1.5,.4,1) both}
.mm-dice{display:flex;justify-content:center;gap:6px;animation:mmSwap .25s .06s cubic-bezier(.2,1.5,.4,1) both}
@keyframes mmSwap{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.mm-die{width:54px;height:54px;background:var(--dt) center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;font:24px/1 "Lilita One",sans-serif;color:#2a2433}
.mm-die small{font:700 11px Rubik,sans-serif;color:#d32d22}
.mm-die small.up{color:#1d8a3e}
.mm-plate{right:calc(150px + var(--sr));top:calc(118px + var(--st));display:flex;align-items:center;gap:8px}
.mm-arr{flex:none;width:64px;height:64px;border:0;padding:0;background:var(--ui-arrow3-l) center/100% 100% no-repeat}
.mm-arr.r{background-image:var(--ui-arrow3-r)}
.mm-np{width:300px;height:102px;background:var(--ui-plate3) center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:text;transition:transform .12s ease-out}
.mm-np span{font:11px "Lilita One",sans-serif;letter-spacing:3px;color:#8a7f6c}
.mm-np input{width:262px;border:0;outline:0;background:none;padding:0 0 0 6px;margin:0;text-align:center;font:40px/1.05 "Lilita One",sans-serif;letter-spacing:6px;color:#2a2433;text-transform:uppercase;caret-color:#d32d22}
.mm-np input::placeholder{color:#2a2433;opacity:1}
.mm-np:focus-within{transform:scale(1.04);filter:drop-shadow(0 0 2px #ffcc30) drop-shadow(0 0 3px #ffcc30) var(--bsh)}
.mm-roster{right:calc(78px + var(--sr));top:calc(250px + var(--st));width:444px;height:75px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;padding:0 2px}
.mm-roster::-webkit-scrollbar{display:none}
.mm .tc{flex:none;width:var(--w);height:62px;border:0;border-radius:0;padding:0;background:var(--rk) center/100% 100% no-repeat;display:grid;place-items:center;scroll-snap-align:center;transition:width .15s ease-in-out,height .15s ease-in-out,transform .16s ease-in-out}
/* roster pictures: each truck fitted into the rock's flat face by its own outline (thumbFit in part3: --iw width, --ix / --iy shift); the selected one 15% bigger */
.mm .tc img{width:var(--iw,83px);height:auto;max-width:none;transform:translate(var(--ix,0px),var(--iy,0px));transition:width .15s,transform .15s}
.mm .tc.sel{width:var(--ws);height:71px;background-image:var(--rw)}
.mm .tc.sel img{width:calc(var(--iw,83px) * 1.15);transform:translate(calc(var(--ix,0px) * 1.15),calc(var(--iy,0px) * 1.15))}
.mm-act{right:calc(120px + var(--sr));top:calc(370px + var(--st));width:360px;display:flex;flex-direction:column;align-items:center;gap:10px}
.mm-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mm-row.sm{width:80%}
.mm-row.sm:has(>:only-child){grid-template-columns:1fr;width:40%}
.mm-row.one{grid-template-columns:1fr;width:calc(50% - 5px)}
.mm-hs{width:100%}
.mb.mm-host{font-size:40px;letter-spacing:2px}
.mb.mm-join{font-size:26px;letter-spacing:2px}
/* Host / Join choices (.op-host / .op-join on .mm-act): the opened button slides up (Join into the Host button's slot), the rest fades out, the two choices and Back fade in below the Host slot (153 = the Host button's height + the gap) */
.mm-hs,.mm-js,.mm-more,.mm-opts{transition:transform .25s ease-in-out,opacity .2s ease-in-out,visibility 0s}
.mm-opts{position:absolute;left:0;right:0;top:153px;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;visibility:hidden;transform:translateY(14px);transition-delay:0s,0s,.25s}
.mm-opts .mm-row .mb{font-size:19px}
.mm-opts .mm-back{width:139px}
.op-host .mm-hs{transform:translateY(-20px)}
.op-join .mm-js{transform:translateY(-104px)}
.op-host .mm-js,.op-host .mm-more,.op-join .mm-more{opacity:0;visibility:hidden;transform:translateY(14px);transition-delay:0s,0s,.25s}
.op-join .mm-hs{opacity:0;visibility:hidden;transform:translateY(-20px);transition-delay:0s,0s,.25s}
.op-host .mm-oh,.op-join .mm-oj{opacity:1;visibility:visible;transform:none;transition-delay:.05s,.05s,0s}
.mb{display:grid;place-items:center;width:100%;border:0;margin:0;padding:0 4%;background:var(--bg) center/100% 100% no-repeat;font:21px/1 "Lilita One",sans-serif;letter-spacing:1px;color:#fff;text-align:center;text-transform:uppercase;transition:transform .16s ease-in-out}
.mb-y{--bg:var(--ui-bb-yellow);aspect-ratio:1415/561;font-size:30px;text-shadow:0 3px 0 #7a5200,2px 0 0 #7a5200,-2px 0 0 #7a5200,0 -2px 0 #7a5200,2px 2px 0 #7a5200,-2px 2px 0 #7a5200,2px -2px 0 #7a5200,-2px -2px 0 #7a5200}
.mb-g{--bg:var(--ui-bb-green);aspect-ratio:703/296;text-shadow:0 3px 0 #146b2e,2px 0 0 #146b2e,-2px 0 0 #146b2e,0 -2px 0 #146b2e,2px 2px 0 #146b2e,-2px 2px 0 #146b2e,2px -2px 0 #146b2e,-2px -2px 0 #146b2e}
.mb-w{--bg:var(--ui-bb-white);aspect-ratio:702/295;color:#2a2433}
.mb span{display:block;text-box:trim-both cap alphabetic}
.mb-d1{--bg:var(--ui-bb-dark1);aspect-ratio:490/212;font-size:16px;padding-top:3.3%}
.mb-d2{--bg:var(--ui-bb-dark2);aspect-ratio:492/212;font-size:16px;padding-top:3.3%}
.mm-top .mb{width:128px;font-size:18px}
.mm-top .mb-y{aspect-ratio:702/295;text-shadow:0 2px 0 #7a5200,1.5px 0 0 #7a5200,-1.5px 0 0 #7a5200,0 -1.5px 0 #7a5200,1.5px 1.5px 0 #7a5200,-1.5px 1.5px 0 #7a5200,1.5px -1.5px 0 #7a5200,-1.5px -1.5px 0 #7a5200}
.mm .mb:disabled{opacity:.5}
/* buttons scale about their centre: hover grows, a press shrinks in place (no slide), all eased in and out */
.mm-arr{transition:transform .16s ease-in-out}
/* a faint soft shadow under everything you can press (follows the art's outline) */
.mm .mb,.mm-arr,.mm .tc,.mm-np{filter:var(--bsh)}
@media (hover:hover){.mm .mb:not(:disabled):hover,.mm-arr:hover,.mm .tc:hover{transform:scale(1.04)}}
.mm .mb:not(:disabled):active,.mm-arr:active,.mm .tc:active{transform:scale(.96);transition:transform .1s ease-in-out}
/* reduced motion (the global rule cuts every transition): the buttons keep their small hover / press easing, it only follows your own touch */
@media (prefers-reduced-motion: reduce){.mm-hs,.mm-js,.mm-more,.mm-opts{transition-duration:.25s,.2s,0s!important}.mm .mb,.mm-arr,.mm .tc{transition-duration:.16s!important}.mm .mb:not(:disabled):active,.mm-arr:active,.mm .tc:active{transition-duration:.1s!important}}
.mm .mb:focus-visible,.mm-arr:focus-visible,.mm .tc:focus-visible{outline:0;transform:scale(1.04);filter:drop-shadow(0 0 2px #ffcc30) drop-shadow(0 0 3px #ffcc30) var(--bsh)}
.mm-gap{display:none}
.mm-notice{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:5;max-width:min(90vw,520px)}
/* settings: a stone panel over the menu (volume, status, bug report, how to play) */
.mm-pop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px}
.mm-scrim{position:absolute;inset:0;border:0;background:rgba(20,16,28,.5)}
.mm-sheet{--ink:#2a2433;--muted:#6e6453;--panel2:#e9e2d3;--line:rgba(42,36,51,.14);position:relative;width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;margin:0;background:linear-gradient(#f6f1e6,#e9e2d3);color:#2a2433;border-radius:18px;box-shadow:0 6px 0 #8c826e,0 20px 40px rgba(0,0,0,.35);padding:16px 18px 18px;font-family:Rubik,sans-serif}
.mm-sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mm-sheet h2{font:28px/1 "Lilita One",sans-serif;letter-spacing:1px;margin:0}
.mm-x{width:40px;height:40px;border:0;border-radius:12px;background:#2a2433;color:#fff;font:20px/1 "Lilita One",sans-serif}
.mm-sheet .volrow{font-family:"Lilita One",sans-serif;font-weight:400;letter-spacing:.5px}
.mm-sheet .status{background:#e9e2d3}
.mm-sheet .btn.ghost{background:#2a2433;color:#fff;margin-top:12px}
.mm-sheet details.how{margin-top:14px;border-top:2px solid rgba(42,36,51,.12);padding-top:12px}
.mm-sheet details.how summary{font:20px "Lilita One",sans-serif;letter-spacing:.5px}
/* landscape layout A (default): truck with its arrows on the left half, die / name / tagline under it; name plate, roster and buttons in a column on the right.
   Layout B (#app.mm.lb, the Layout switch in Settings, a trial): truck centred with the name on top and the die under it, roster down the left, name plate top right, the buttons in one row along the bottom (Host / Join choices pop up above it) */
@media (orientation:landscape){
.mm-dice{order:-1}
#app.mm.lb .mm-roster{left:calc(45px + var(--sl));right:auto;top:calc(185px + var(--st));width:100px;height:352px;flex-direction:column;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y proximity;padding:2px 0}
#app.mm.lb .mm-stage{left:0;right:0;margin:0 auto;width:618px;top:calc(280px + var(--st))}
#app.mm.lb .mm-info{left:0;right:0;margin:0 auto;top:var(--st);width:1280px;height:720px;display:block}
#app.mm.lb .mm-nrow{position:absolute;left:0;right:0;top:36px}
#app.mm.lb .mm-tag{position:absolute;left:0;right:0;top:90px}
#app.mm.lb .mm-dice{position:absolute;left:0;right:0;top:440px}
#app.mm.lb .mm-plate{right:calc((30px + var(--sr)) / .82);top:calc((96px + var(--st)) / .82);zoom:calc(var(--mz,1) * .82)}
#app.mm.lb .mm-act{left:0;right:0;margin:0 auto;top:auto;bottom:calc(36px + var(--sb));width:806px;display:grid;grid-template-columns:145px 295px 167px 148px;column-gap:17px;align-items:center;justify-items:center}
#app.mm.lb .mm-hs{grid-column:2;grid-row:1}
#app.mm.lb .mm-js{grid-column:3;grid-row:1;width:100%}
#app.mm.lb .mm-more{display:contents}
#app.mm.lb .mm-more>*{transition:opacity .2s ease-in-out,visibility 0s}
#app.mm.lb .mm-more>[data-a=practice]{grid-column:1;grid-row:1}
#app.mm.lb .mm-more>[data-a=editor]{grid-column:4;grid-row:1}
#app.mm.lb .mm-opts{top:auto;bottom:calc(100% + 14px);left:calc(50% - 180px);right:auto;width:360px}
#app.mm.lb .op-host .mm-hs,#app.mm.lb .op-join .mm-js{transform:none}
#app.mm.lb .op-host .mm-more>*,#app.mm.lb .op-join .mm-more>*{opacity:0;visibility:hidden;transition-delay:0s,.25s}
}
@media (orientation:portrait){
/* portrait fits the screen: --mzp (menuZoom) keeps the stack (641 px at zoom 1) within the height with at least 230 px left for the truck, which the camera frames into .mm-gap; the logo and Settings sit over the scene in the top corners */
#app.mm{display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 20px)}
.mm .mmg{position:static;zoom:var(--mzp,1)}
.mm-logo{width:150px;position:absolute!important;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px)}
.mm-top{position:absolute!important;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px)}
.mm-gap{display:block;order:1;flex:1 0 230px}
.mm-info{order:2;gap:6px;width:444px;align-items:center;text-align:center}
.mm-name{font-size:54px}
.mm-die{width:44px;height:44px;font-size:20px}
.mm-plate{order:3;margin-top:10px}
.mm-roster{order:4;margin-top:8px}
.mm-act{order:5;align-self:center;margin-top:12px;position:relative!important;right:auto;bottom:auto;top:auto}
.mm-stage,.mm-idx{display:none}
.mm-plate .mm-arr{display:block}
}
.pgrid{display:grid;gap:8px}
.pgame{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:var(--panel2);border-radius:14px;padding:11px 12px}
.pgame:active{transform:translateY(1px)}
.pgame span{flex:1;min-width:0}.pgame b{display:block;font-family:var(--display);font-weight:400;font-size:16px}
.pgame small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pgame em{flex:none;font-style:normal;text-align:right;font-weight:800;font-size:12px;color:var(--muted);line-height:1.4}
.ram{background:radial-gradient(circle at 38% 32%,#FF8A8D,#E5484D 55%,#B3262D)!important;box-shadow:0 0 0 5px #151B24,0 0 0 9px #FFC83D,0 12px 26px rgba(0,0,0,.45)!important;font-size:22px!important;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.ram .ramcd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(16,22,31,.72) calc(var(--cd,0) * 360deg),transparent 0);pointer-events:none}.ram span{position:relative}
.ram.cd{opacity:1!important}
.ram.ram2{right:132px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:78px;height:78px;font-size:15px!important;background:radial-gradient(circle at 38% 32%,#FFE27A,#FF8A1F 55%,#C25E0B)!important}
.ram.ram3{right:30px;bottom:calc(env(safe-area-inset-bottom,0px) + 142px);width:78px;height:78px;font-size:15px!important;background:radial-gradient(circle at 38% 32%,#9FE3FF,#2F7DE1 55%,#1D4F95)!important}
.ram.held{transform:translateY(4px) scale(.93);filter:brightness(.82);box-shadow:0 0 0 5px #151B24,0 0 0 9px #FFC83D,inset 0 6px 12px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.35)!important}
.ram.lng{font-size:16px!important;letter-spacing:0}
.tapall.kick{transform:translateY(2px)}
.tp-pedal,.tp-launch,.tp-drop,.tp-jump{background:linear-gradient(180deg,#2A303C,#171C25)!important;border:2px solid #3A4150!important;box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden;text-align:left}
.tp-pedal::before,.tp-launch::before,.tp-drop::before,.tp-jump::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(-45deg,#FFC83D 0 10px,#151B24 10px 20px)}
.tp-gauge{position:absolute;left:18px;right:44%;top:26px;height:14px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

body.mglive #fxs,body.mgres #fxs{display:none}

/* TV controller: sideways layout (stick on the left half, buttons on the right) + rotate hint when upright */
.tvrot{display:none;position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:4;background:var(--hb);color:#FFC83D;font-family:var(--display);font-size:13px;padding:6px 14px 5px;border-radius:999px;box-shadow:0 0 0 2.5px #151B24;white-space:nowrap;pointer-events:none}
@media (orientation:portrait){.tvrot{display:block}}
@media (orientation:landscape){
  .tvc .m3pad{left:0;right:auto;top:0;bottom:0;width:58%;height:100%!important;border-top:0;border-right:2px dashed rgba(255,255,255,.12)}
  .tvc .tvchint{top:46%}
  .tvc .m3pad.twin{width:50%}
  .tvc .m3pad.aim{left:50%;width:50%;border-right:0}
  /* the button fills the whole right side; two buttons split it along the diagonal (top left to bottom right): the main one
     below it, the second one above */
  .tvc .ram{left:58%;right:0;top:0;bottom:0;width:auto;height:auto;border-radius:0;font-size:32px!important;background:linear-gradient(160deg,#F0686C,#C7343A)!important;box-shadow:inset 4px 0 0 rgba(0,0,0,.22)!important}
  /* the cooldown on these big rectangles: a dark shade from the top that drains away as the button recharges (the round
     buttons keep their clock-style sweep) */
  .tvc .ram .ramcd{border-radius:0;background:linear-gradient(to bottom,rgba(16,22,31,.72) calc(var(--cd,0) * 100%),transparent 0)}
  .tvc .ram.held{transform:none;filter:brightness(.8)}
  .tvc .ram:has(~ .ram2){clip-path:polygon(0 0,0 100%,100% 100%)}
  .tvc .ram:has(~ .ram2) span{position:absolute;left:30%;top:70%;transform:translate(-50%,-50%)}
  .tvc .ram.ram2{left:58%;right:0;top:0;bottom:0;width:auto;height:auto;background:linear-gradient(160deg,#FFC24A,#E0700F)!important;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px));font-size:26px!important}
  .tvc .ram.ram2 span{position:absolute;left:70%;top:30%;transform:translate(-50%,-50%)}
  /* three buttons: the main one fills the bottom half, the second and third share the top half (third on the left) */
  .tvc .ram:not(.ram2):not(.ram3):has(~ .ram3){clip-path:none;top:50%}
  .tvc .ram.ram2:has(~ .ram3){clip-path:none;left:79%;top:0;bottom:50%;box-shadow:inset 3px 0 0 rgba(0,0,0,.22),inset 0 -3px 0 rgba(0,0,0,.25)!important}
  .tvc .ram:has(~ .ram3) span,.tvc .ram.ram2:has(~ .ram3) span{left:50%;top:50%}
  .tvc .ram.ram3{left:58%;right:21%;top:0;bottom:50%;width:auto;height:auto;border-radius:0;background:linear-gradient(160deg,#7FD6FF,#2F7DE1)!important;box-shadow:inset 4px 0 0 rgba(0,0,0,.22),inset 0 -3px 0 rgba(0,0,0,.25)!important;font-size:24px!important}
  .tvcctl.swc{left:0}
  .tvc .slpad{right:42%;border-right:2px dashed rgba(255,255,255,.12)}
  .tvc .tvserve{background:linear-gradient(160deg,#FF8FC0,#E0458A)!important}
  .swpad{top:0}
  .swpad .sw-l{left:12%}
  .swpad .sw-r{right:12%}
  .swpad .sw-u{top:calc(env(safe-area-inset-top,0px) + 16px)}
  /* one panel: centred */
  .tvcctl .tapall,.tvcctl .cx{left:0;right:0;margin:0 auto;width:min(64%,520px);height:auto;top:calc(env(safe-area-inset-top,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
  .tvc .m3top{max-width:none}
}

/* phone controller: dice panel fits without scrolling (items share the width; sideways = card on the left, panel on the right) */
@media (orientation:landscape){
  body.ctl .hudbot{flex-direction:row;align-items:stretch;justify-content:center;gap:10px;max-width:none;top:calc(env(safe-area-inset-top,0px) + 50px);padding:0 12px calc(env(safe-area-inset-bottom,0px) + 8px)}
  body.ctl #hostgone:empty{display:none}
  body.ctl #ctlme{flex:0 0 30%;display:flex;flex-direction:column;justify-content:center;gap:8px}
  body.ctl .ctlcard{max-width:none}
  body.ctl .ctlidle{padding:6px 0;font-size:18px}
  body.ctl .hcard{flex:1;min-width:0;max-width:620px;display:flex;flex-direction:column}
  body.ctl .msg{font-size:15px}
  body.ctl .panhint{font-size:12px;margin:2px 0 6px}
}

/* phones in a TV game: rotate overlay while upright */
#rotov{display:none;position:fixed;inset:0;z-index:200;background:radial-gradient(120% 80% at 50% 20%,#2B3A58,#121826);color:#fff;place-items:center;padding:24px;text-align:center;touch-action:none}
@media (orientation:portrait){body.tvphone #rotov{display:grid}}
.rotbox{max-width:340px}
.rotbox h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;margin:26px 0 8px;color:#FFC83D;-webkit-text-stroke:5px #151B24;paint-order:stroke fill}
.rotbox>p{font-weight:700;opacity:.85}
.rotph{width:70px;height:118px;margin:0 auto;border:5px solid #fff;border-radius:16px;position:relative;animation:rotPh 2.4s ease-in-out infinite}
.rotph i{position:absolute;left:50%;bottom:6px;width:16px;height:5px;margin-left:-8px;border-radius:3px;background:#fff}
@keyframes rotPh{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.rotph{animation-iteration-count:1}}
.tbtip{margin-top:18px;background:var(--hb);border:2.5px solid #FFC83D;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4;font-weight:600;text-align:left;color:#fff}
.tbtip span{opacity:.7}
.tbsheet .tbtip{margin:0 0 10px}
.tvrot{display:none!important}

/* dice choice buttons: faces in a 3x2 grid, squarer buttons */
body.ctl .pan{max-height:none!important;overflow:visible!important}

/* TV lobby: practice a minigame */
.tvlobby .tvprac{grid-column:2 / span 2}
.pracgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.pracb{background:var(--hb2);color:#fff;border:2.5px solid #151B24;border-radius:12px;padding:8px 6px;font-family:var(--display);font-size:12px;line-height:1.15;box-shadow:0 3px 0 #151B24}
.pracb:active{transform:translateY(2px);box-shadow:0 1px 0 #151B24}
.mgtog.off{background:#3A3F48;color:#8E96A3;text-decoration:line-through;box-shadow:none}
.mgtog small{font-family:var(--ui,inherit);font-size:10px;opacity:.75}
.tvdrivers .pracgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.tvdrivers .pracb{font-size:11px;padding:6px 4px}

/* minigame tips at the top (under the top bar, clear of the leaderboard); the countdown stays in the middle */
#mg:not(.tvsplit) .m3center.hi{top:40%;bottom:auto}
#mg:not(.tvsplit) .m3center .m3msg{position:fixed;left:10px;right:auto;top:calc(env(safe-area-inset-top,0px) + 56px);max-width:calc(100% - 150px);margin:0;text-align:left;white-space:normal;font-size:14px;line-height:1.25;z-index:2}
#mg:not(.tvsplit):has(.m3lb.top) .m3center .m3msg{top:calc(env(safe-area-inset-top,0px) + 92px);max-width:calc(100% - 20px)}
</style>
