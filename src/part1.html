<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Big Rig Rumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#9fd4f5; --yellow:#FFC83D; --yellow-dk:#E0A800; --sign:#0E7A55; --red:#E5484D; --blue:#2F7DE1; --purple:#8E5BE0; --green:#1FA35C;
  --ink:#151B24; --muted:#5B6576; --panel:#FFFFFF; --panel2:#F1F4F8; --line:rgba(21,27,36,.12); --shadow:0 10px 30px rgba(10,20,40,.18);
  --hud:rgba(16,22,31,.84); --hud2:rgba(255,255,255,.08); --hudline:rgba(255,255,255,.12);
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#EEF3F8;--muted:#9AA6B7;--panel:#18212C;--panel2:#212C39;--line:rgba(255,255,255,.1);--shadow:0 10px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--ink:#EEF3F8;--muted:#9AA6B7;--panel:#18212C;--panel2:#212C39;--line:rgba(255,255,255,.1);--shadow:0 10px 30px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:#7FBF6A;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
#app{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:0 12px 24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
p{line-height:1.45;margin:0}
.stage{height:40vh;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;padding:14px 4px 10px;pointer-events:none}
.stage.short{height:30vh;min-height:190px}
.stage.tall{height:58vh;min-height:320px}
.brand{font-family:var(--display);font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:28px;height:10px;border-radius:5px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 6px,#151B24 6px 12px)}
.showname{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;pointer-events:auto}
.showname h2{font-size:clamp(28px,8vw,40px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3)}
.showname p{color:#fff;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.5);font-size:14px;margin-top:4px}
.arrows{display:flex;gap:8px}
.arr{width:44px;height:44px;border-radius:50%;border:0;background:rgba(16,22,31,.6);color:#fff;font-size:22px;font-weight:800;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{background:var(--panel);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-top:10px}
.sheet h2{font-size:18px;margin-bottom:10px}
.sheet+.sheet{margin-top:12px}
label.field{display:block;font-weight:700;font-size:14px;color:var(--muted)}
label.field input,select.inp{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:17px;background:var(--panel2);color:var(--ink)}
.carousel{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -4px}
.carousel::-webkit-scrollbar{display:none}
.tc{flex:none;width:96px;scroll-snap-align:start;border:2px solid transparent;border-radius:14px;background:var(--panel2);padding:4px 4px 6px;text-align:center}
.tc img{width:100%;height:62px;object-fit:contain;display:block}
.tc span{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc.sel{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 22%,var(--panel2))}
.faces{display:flex;gap:4px;flex-wrap:wrap}
.f{position:relative;display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border-radius:7px;background:#fff;color:#151B24;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.2);font-weight:800;font-size:13px}
.f sub{position:absolute;right:-6px;bottom:-7px;font-size:9px;line-height:1;padding:2px 3px;border-radius:5px;color:#fff;font-weight:800}
.f sub.up{background:var(--green)}.f sub.dn{background:var(--red)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 16px;font-family:var(--display);font-size:17px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:var(--yellow);color:#151B24}
.btn.sign{background:var(--sign);color:#fff}
.btn.ghost{background:var(--panel2);color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;box-shadow:none}
.btn.red{background:var(--red);color:#fff}
.btn.small{padding:10px 12px;font-size:14px;width:auto}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack>*+*{margin-top:10px}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--panel2)}
.status b{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block}
.status.ok b{background:var(--green)}.status.bad b{background:var(--red)}.status.wait b{background:var(--yellow)}
.qrbox{display:flex;gap:14px;align-items:center}
.qr{background:#fff;padding:8px;border-radius:14px;flex:none;width:150px;height:150px;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.qr img,.qr canvas{width:134px!important;height:134px!important}
.code{font-family:var(--display);font-size:30px;letter-spacing:4px}
.linkline{font-size:12px;word-break:break-all;color:var(--muted);margin-top:8px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist img{width:58px;height:40px;object-fit:contain;flex:none}
.plist .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.plist .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.xbtn{border:0;background:var(--panel2);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 0;font-weight:800;font-size:16px;border-radius:9px}
.seg button.on{background:var(--yellow);color:#151B24}
.gamebtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:0;border-radius:14px;padding:10px;margin-bottom:8px}
.gamebtn img{width:70px;height:48px;object-fit:contain;flex:none}
.gamebtn .code{font-size:18px;letter-spacing:2px;margin-left:auto}
.empty{padding:14px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;font-size:14px;line-height:1.45}
.banner{background:var(--red);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;margin-top:10px;font-size:14px}
.diag{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.diag code{background:var(--panel2);padding:1px 5px;border-radius:5px}
details.how summary{font-family:var(--display);font-size:17px;cursor:pointer}
details.how ul{padding-left:18px;margin:10px 0 0}details.how li{margin:6px 0;line-height:1.45;font-size:15px}
.localform{background:var(--panel2);border-radius:14px;padding:12px;margin-top:10px}
/* HUD */
.hudtop{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;gap:8px;align-items:center;max-width:560px;margin:0 auto;pointer-events:none}
.hudtop>*{pointer-events:auto}
.chip{background:var(--hud);color:#fff;border-radius:999px;padding:8px 13px;font-weight:800;font-size:14px;white-space:nowrap;border:1px solid var(--hudline);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip.grow{flex:1;overflow:hidden;text-overflow:ellipsis;min-width:0}
button.chip{border:1px solid var(--hudline)}
.hudbot{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:560px;margin:0 auto;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none}
.hudbot>*{pointer-events:auto}
.hcard{background:var(--hud);color:#fff;border-radius:20px;border:1px solid var(--hudline);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.msg{padding:11px 14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--hudline);display:flex;gap:10px;align-items:center;min-height:46px}
.msg i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.pan{padding:12px 14px}
.pan h3{font-size:17px;margin-bottom:8px;color:var(--yellow)}
.pan p{color:#dfe6ef;font-size:15px}
.dice2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diebtn{background:var(--hud2);border:1px solid var(--hudline);border-radius:14px;padding:10px;text-align:left;color:#fff}
.diebtn:active{transform:translateY(2px)}
.diebtn b{font-family:var(--display);font-weight:400;font-size:14px;display:block;margin-bottom:8px}
.diebtn.char{background:var(--yellow);color:#151B24;border-color:transparent}
.pstrip{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 12px;border-top:1px solid var(--hudline)}
.pstrip::-webkit-scrollbar{display:none}
.pc{flex:none;display:flex;align-items:center;gap:6px;background:var(--hud2);border-radius:12px;padding:5px 9px 5px 5px;border:1.5px solid transparent;min-width:0}
.pc.now{border-color:var(--yellow);background:rgba(255,200,61,.14)}
.pc img{width:40px;height:28px;object-fit:contain}
.pc .who b{display:block;font-size:13px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .stats{display:flex;gap:7px;font-weight:800;font-size:13px;align-items:center}
.pc .stats span{display:inline-flex;align-items:center;gap:2px}
.pc .off{font-size:10px;color:#ff9a9d;font-weight:700}
.pc .cdot{width:8px;height:28px;border-radius:4px;flex:none}
.ico{width:15px;height:15px;flex:none}
.hostgone{background:var(--red);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;margin-bottom:8px;font-size:14px}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;display:grid;place-items:center}
.dlabel{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);background:rgba(16,22,31,.9);color:#fff;border-radius:999px;padding:9px 16px;font-weight:800;white-space:nowrap;animation:pop .25s ease-out}
.toast{max-width:320px;margin:0 20px;background:var(--purple);color:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;animation:pop .3s ease-out;transform:translateY(-12vh)}
.toast h3{font-size:26px;margin-bottom:6px}
.toast.bat{background:linear-gradient(160deg,#FFD65C,#FFB81F);color:#151B24}
.toast svg{width:84px;height:auto;display:block;margin:0 auto 6px}
@keyframes pop{from{scale:.6;opacity:0}to{scale:1;opacity:1}}
/* minigame overlay */
#mg{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 80% at 50% 0%,#23344a,#0f1620);color:#fff;overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#mg.on{display:block}
.mgwrap{max-width:520px;margin:0 auto;padding:14px}
.mghead{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.mghead h2{font-size:26px;flex:1;color:var(--yellow)}
.mghead .tag{font-size:12px;font-weight:800;background:rgba(255,255,255,.1);padding:5px 9px;border-radius:999px}
.mgstage{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:14px;min-height:400px;position:relative;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.mgstage canvas{display:block;width:100%;border-radius:14px;touch-action:none}
.mgstage p{color:#dfe6ef}
.count{font-family:var(--display);font-size:110px;text-align:center;padding:40px 0 10px;color:var(--yellow)}
.bigtxt{font-family:var(--display);font-size:44px;text-align:center}
.hint{text-align:center;color:#b9c4d2;font-weight:700;margin:6px 0}
.pedal{display:block;margin:14px auto 0;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7a7e,#d6333a);color:#fff;border:0;box-shadow:inset 0 -10px 0 rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.4);font-family:var(--display);font-size:30px;touch-action:manipulation}
.pedal:active{transform:scale(.96)}
.gbar{position:relative;height:56px;border-radius:14px;background:linear-gradient(90deg,#E5484D,#FFC83D 50%,#1FA35C);margin:24px 0 10px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.gzone{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.8)}
.gneedle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:#151B24;border-radius:3px;box-shadow:0 0 0 2px #fff}
.tapzone{width:100%;min-height:170px;border:0;border-radius:20px;background:rgba(255,255,255,.1);color:#fff;font-family:var(--display);font-size:28px;margin-top:10px;touch-action:manipulation}
.tapzone:active{background:rgba(255,255,255,.18)}
.light{width:140px;height:140px;border-radius:50%;margin:18px auto;background:#3a1618;box-shadow:inset 0 -8px 0 rgba(0,0,0,.3)}
.light.red{background:radial-gradient(circle at 40% 35%,#ff8a8d,#E5484D);box-shadow:0 0 40px #E5484D}
.light.green{background:radial-gradient(circle at 40% 35%,#7cf0a8,#1FA35C);box-shadow:0 0 50px #1FA35C}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.pad{height:130px;border:0;border-radius:22px;opacity:.45;transition:opacity .1s,transform .1s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.pad.lit{opacity:1;transform:scale(1.04)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{border:0;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;font-family:var(--display);font-size:30px;padding:18px 0}
.arrowq{font-size:110px;text-align:center;line-height:1;margin:14px 0;font-family:var(--display);color:var(--yellow)}
.restable{width:100%;border-collapse:collapse}
.restable td{padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:700}
.restable td.aw{text-align:right;font-family:var(--display);font-weight:400;color:var(--yellow);white-space:nowrap}
.restable small{font-weight:500;color:#b9c4d2}
.sheet .restable td{border-bottom-color:var(--line)}
.sheet .restable td.aw{color:var(--ink)}
.sheet .restable small{color:var(--muted)}
.pass{text-align:center;padding:30px 6px}
.pass img{width:200px;max-width:70%}
#mg.live{background:none;overflow:hidden}
body.mglive .hudtop,body.mglive .hudbot,body.mglive #fx{display:none}
#mg.live>*{pointer-events:auto}
.m3top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;gap:8px;align-items:center;max-width:560px;margin:0 auto}
.m3lb{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 58px);background:var(--hud);border:1px solid var(--hudline);border-radius:14px;padding:6px 10px;font-size:12px;font-weight:700;color:#fff;min-width:118px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.m3lb div{display:flex;gap:6px;align-items:center;padding:2px 0}.m3lb span{flex:1;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m3lb i{width:8px;height:8px;border-radius:50%;flex:none}.m3lb .me{color:var(--yellow)}.m3lb .out{opacity:.45;text-decoration:line-through}
.m3intro{position:absolute;left:10px;right:140px;top:calc(env(safe-area-inset-top,0px) + 58px);background:var(--hud);border:1px solid var(--hudline);color:#fff;border-radius:18px;padding:14px;max-width:420px}
.m3intro h3{color:var(--yellow);font-size:20px;margin-bottom:6px}.m3intro p{font-size:14px;line-height:1.45}.m3ctl{margin-top:8px;color:#b9c4d2;font-weight:700}
.m3center{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none!important}
.m3big{font-family:var(--display);font-size:110px;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.45);line-height:1}
.m3msg{display:inline-block;margin-top:10px;background:var(--hud);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800}
.m3ready{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--hud);border:1px solid var(--hudline);border-radius:22px;padding:16px;color:#fff;max-width:520px;margin:0 auto;z-index:3;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.m3ready h3{color:var(--yellow);font-size:20px;margin-bottom:8px}
#m3rl{margin-bottom:12px}#m3rl div{display:flex;gap:8px;align-items:center;padding:6px 0;font-weight:700;border-bottom:1px solid var(--hudline)}
#m3rl i{width:10px;height:10px;border-radius:50%;flex:none}#m3rl span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#m3rl b{color:#b9c4d2;font-size:13px}#m3rl b.ok{color:#7cf0a8}
.m3pad{position:absolute;left:0;right:0;bottom:0;height:58%;touch-action:none}
.knob{position:absolute;width:124px;height:124px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(16,22,31,.22);transform:translate(-50%,-50%);pointer-events:none}
.knob i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ram{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:100px;height:100px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#ff8a8d,#E5484D);color:#fff;font-family:var(--display);font-size:20px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.35);touch-action:manipulation;z-index:2}
.ram.cd{opacity:.4}
.tapall{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);height:21%;border-radius:26px;background:rgba(16,22,31,.28);color:#fff;font-family:var(--display);font-size:34px;border:2px solid rgba(255,255,255,.4);touch-action:manipulation}
.tapall:active{background:rgba(255,200,61,.45)}
#mg.res{background:rgba(8,20,14,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px}
body.mgres .hudtop,body.mgres .hudbot{display:none}
.resx{width:100%;max-width:440px;animation:pop .35s ease-out}
.rescard{position:relative;background:linear-gradient(170deg,#12925F,#0B6647);color:#fff;border-radius:26px;padding:22px 18px 16px;box-shadow:0 22px 60px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.9),inset 0 0 0 7px #0B6647;overflow:hidden}
.reshz{position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(-45deg,#FFC83D 0 12px,#151B24 12px 24px)}
.reshead{text-align:center;margin:6px 0 14px}

/* no page scrolling, bounce or pull-to-refresh while a phone is a controller or in a minigame */
html,body{overscroll-behavior:none}
body.mglive,body.ctl{position:fixed;inset:0;width:100%;overflow:hidden}
#mg.live{touch-action:none}
body.ctl .hudbot{touch-action:none}body.ctl .hcard{touch-action:pan-y;overscroll-behavior:contain}

/* stick games on the TV: the phone is only a stick and a button */
.tvc.bare>.m3top,.tvc.bare>.tvcme,.tvc.bare>.tvcmsg{display:none}
.tvc.bare .m3pad{height:100%;border-top:0}

/* battery purchase */
.batlabel{border-color:var(--c)!important;box-shadow:0 0 0 3px var(--c),0 6px 0 var(--ledge)!important}
.pc.batbump{animation:batBump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes batBump{0%{transform:scale(1)}35%{transform:scale(1.18);box-shadow:0 0 0 4px #7CF0A8,0 3px 0 var(--ledge)}100%{transform:scale(1)}}

/* Magnet Mike countdown: a die-cut sticker (white border + dark outline around the text panel and his truck together) */
.mike{transform:translateY(-14vh);animation:mkIn .45s cubic-bezier(.2,1.4,.4,1) both,mkOut .35s ease-in 2.3s forwards;padding:0 12px}
.mk-st{position:relative;display:inline-block;padding:84px 54px 0 0}
.mk-box{position:relative;background:#182032;border-radius:16px;padding:12px 158px 14px 18px;display:flex;flex-direction:column;align-items:flex-start;line-height:1;font-family:var(--display);font-weight:400;color:#fff;box-shadow:0 0 0 3px #FFC83D,0 0 0 6px #151B24,0 8px 0 3px #151B24,0 14px 18px rgba(0,0,0,.35)}
.mk-st img{position:absolute;right:0;top:0;height:200px;width:auto;transform-origin:50% 85%;animation:mkSwing 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.mk-name{font-size:17px;color:#FFC83D;letter-spacing:1px;text-transform:uppercase}
.mk-big{font-size:28px;margin-top:3px;white-space:nowrap;text-transform:uppercase}
.mk-big i{font-style:normal;color:#FF5A5F;font-size:1.3em;display:inline-block;animation:mkPulse .6s ease-in-out 3 alternate}
.mike.now .mk-big i{font-size:1em}
.mk-sub{font-family:var(--body);font-weight:800;font-size:12px;margin-top:5px;color:#B9C4D2}
@keyframes mkIn{0%{opacity:0;transform:translateY(-14vh) scale(1.5) rotate(8deg)}60%{opacity:1;transform:translateY(-14vh) scale(.94) rotate(-4deg)}100%{opacity:1;transform:translateY(-14vh) scale(1) rotate(-3deg)}}
@keyframes mkOut{from{transform:translateY(-14vh) rotate(-3deg)}to{opacity:0;transform:translateY(-14vh) scale(.7) rotate(-10deg)}}
@keyframes mkSwing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes mkPulse{to{transform:scale(1.18)}}
@media (max-width:520px){.mk-st{padding:60px 36px 0 0}.mk-st img{height:142px}.mk-box{padding:9px 112px 11px 12px}.mk-name{font-size:12px}.mk-big{font-size:18px}}
@media (prefers-reduced-motion:reduce){.mk-st img{animation-iteration-count:1}}


/* board event sticker */
.evs{transform:translateY(-14vh);animation:mkIn .45s cubic-bezier(.2,1.4,.4,1) both,mkOut .35s ease-in 2.3s forwards;padding:0 16px 0 34px;max-width:100%}
