<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Big Rig Rumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#9fd4f5; --yellow:#FFC83D; --yellow-dk:#E0A800; --sign:#0E7A55; --red:#E5484D; --blue:#2F7DE1; --purple:#8E5BE0; --green:#1FA35C;
  --ink:#151B24; --muted:#5B6576; --panel:#FFFFFF; --panel2:#F1F4F8; --line:rgba(21,27,36,.12); --shadow:0 10px 30px rgba(10,20,40,.18);
  --hud:rgba(16,22,31,.84); --hud2:rgba(255,255,255,.08); --hudline:rgba(255,255,255,.12);
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#EEF3F8;--muted:#9AA6B7;--panel:#18212C;--panel2:#212C39;--line:rgba(255,255,255,.1);--shadow:0 10px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--ink:#EEF3F8;--muted:#9AA6B7;--panel:#18212C;--panel2:#212C39;--line:rgba(255,255,255,.1);--shadow:0 10px 30px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:#7FBF6A;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
#app{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:0 12px 24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
p{line-height:1.45;margin:0}
.stage{height:40vh;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;padding:14px 4px 10px;pointer-events:none}
.stage.short{height:30vh;min-height:190px}
.stage.tall{height:58vh;min-height:320px}
.brand{font-family:var(--display);font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:28px;height:10px;border-radius:5px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 6px,#151B24 6px 12px)}
.showname{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;pointer-events:auto}
.showname h2{font-size:clamp(28px,8vw,40px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3)}
.showname p{color:#fff;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.5);font-size:14px;margin-top:4px}
.arrows{display:flex;gap:8px}
.arr{width:44px;height:44px;border-radius:50%;border:0;background:rgba(16,22,31,.6);color:#fff;font-size:22px;font-weight:800;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{background:var(--panel);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-top:10px}
.sheet h2{font-size:18px;margin-bottom:10px}
.sheet+.sheet{margin-top:12px}
label.field{display:block;font-weight:700;font-size:14px;color:var(--muted)}
label.field input,select.inp{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:17px;background:var(--panel2);color:var(--ink)}
.carousel{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -4px}
.carousel::-webkit-scrollbar{display:none}
.tc{flex:none;width:96px;scroll-snap-align:start;border:2px solid transparent;border-radius:14px;background:var(--panel2);padding:4px 4px 6px;text-align:center}
.tc img{width:100%;height:62px;object-fit:contain;display:block}
.tc span{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc.sel{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 22%,var(--panel2))}
.faces{display:flex;gap:4px;flex-wrap:wrap}
.f{position:relative;display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border-radius:7px;background:#fff;color:#151B24;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.2);font-weight:800;font-size:13px}
.f sub{position:absolute;right:-6px;bottom:-7px;font-size:9px;line-height:1;padding:2px 3px;border-radius:5px;color:#fff;font-weight:800}
.f sub.up{background:var(--green)}.f sub.dn{background:var(--red)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 16px;font-family:var(--display);font-size:17px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:var(--yellow);color:#151B24}
.btn.sign{background:var(--sign);color:#fff}
.btn.ghost{background:var(--panel2);color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;box-shadow:none}
.btn.red{background:var(--red);color:#fff}
.btn.small{padding:10px 12px;font-size:14px;width:auto}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack>*+*{margin-top:10px}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:8px}
.maprules{padding-left:18px}.maprules li{margin-top:3px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--panel2)}
.status b{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block}
.status.ok b{background:var(--green)}.status.bad b{background:var(--red)}.status.wait b{background:var(--yellow)}
.qrbox{display:flex;gap:14px;align-items:center}
.qr{background:#fff;padding:8px;border-radius:14px;flex:none;width:150px;height:150px;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.qr img,.qr canvas{width:134px!important;height:134px!important}
.code{font-family:var(--display);font-size:30px;letter-spacing:4px}
.linkline{font-size:12px;word-break:break-all;color:var(--muted);margin-top:8px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist img{width:58px;height:40px;object-fit:contain;flex:none}
.plist .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.plist .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.xbtn{border:0;background:var(--panel2);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 0;font-weight:800;font-size:16px;border-radius:9px}
.seg button.on{background:var(--yellow);color:#151B24}
.gamebtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:0;border-radius:14px;padding:10px;margin-bottom:8px}
.gamebtn img{width:70px;height:48px;object-fit:contain;flex:none}
.gamebtn .code{font-size:18px;letter-spacing:2px;margin-left:auto}
.empty{padding:14px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;font-size:14px;line-height:1.45}
.banner{background:var(--red);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;margin-top:10px;font-size:14px}
.diag{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.diag code{background:var(--panel2);padding:1px 5px;border-radius:5px}
details.how summary{font-family:var(--display);font-size:17px;cursor:pointer}
details.how ul{padding-left:18px;margin:10px 0 0}details.how li{margin:6px 0;line-height:1.45;font-size:15px}
.localform{background:var(--panel2);border-radius:14px;padding:12px;margin-top:10px}
/* HUD */
.hudtop{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;gap:8px;align-items:center;max-width:560px;margin:0 auto;pointer-events:none}
.hudtop>*{pointer-events:auto}
.chip{background:var(--hud);color:#fff;border-radius:999px;padding:8px 13px;font-weight:800;font-size:14px;white-space:nowrap;border:1px solid var(--hudline);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip.grow{flex:1;overflow:hidden;text-overflow:ellipsis;min-width:0}
button.chip{border:1px solid var(--hudline)}
.hudbot{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:560px;margin:0 auto;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none}
.hudbot>*{pointer-events:auto}
.hcard{background:var(--hud);color:#fff;border-radius:20px;border:1px solid var(--hudline);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.msg{padding:11px 14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--hudline);display:flex;gap:10px;align-items:center;min-height:46px}
.msg i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.pan{padding:12px 14px}
.pan h3{font-size:17px;margin-bottom:8px;color:var(--yellow)}
.pan p{color:#dfe6ef;font-size:15px}
.dice2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diebtn{background:var(--hud2);border:1px solid var(--hudline);border-radius:14px;padding:10px;text-align:left;color:#fff}
.diebtn:active{transform:translateY(2px)}
.diebtn b{font-family:var(--display);font-weight:400;font-size:14px;display:block;margin-bottom:8px}
.diebtn.char{background:var(--yellow);color:#151B24;border-color:transparent}
.pstrip{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 12px;border-top:1px solid var(--hudline)}
.pstrip::-webkit-scrollbar{display:none}
.pc{flex:none;display:flex;align-items:center;gap:6px;background:var(--hud2);border-radius:12px;padding:5px 9px 5px 5px;border:1.5px solid transparent;min-width:0}
.pc.now{border-color:var(--yellow);background:rgba(255,200,61,.14)}
.pc img{width:40px;height:28px;object-fit:contain}
.pc .who b{display:block;font-size:13px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .stats{display:flex;gap:7px;font-weight:800;font-size:13px;align-items:center}
.pc .stats span{display:inline-flex;align-items:center;gap:2px}
.pc .off{font-size:10px;color:#ff9a9d;font-weight:700}
.pc .cdot{width:8px;height:28px;border-radius:4px;flex:none}
.ico{width:15px;height:15px;flex:none}
.hostgone{background:var(--red);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;margin-bottom:8px;font-size:14px}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;display:grid;place-items:center}
.dlabel{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);background:rgba(16,22,31,.9);color:#fff;border-radius:999px;padding:9px 16px;font-weight:800;white-space:nowrap;animation:pop .25s ease-out}
.toast{max-width:320px;margin:0 20px;background:var(--purple);color:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;animation:pop .3s ease-out;transform:translateY(-12vh)}
.toast h3{font-size:26px;margin-bottom:6px}
.toast.bat{background:linear-gradient(160deg,#FFD65C,#FFB81F);color:#151B24}
.toast svg{width:84px;height:auto;display:block;margin:0 auto 6px}
@keyframes pop{from{scale:.6;opacity:0}to{scale:1;opacity:1}}
/* minigame overlay */
#mg{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 80% at 50% 0%,#23344a,#0f1620);color:#fff;overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#mg.on{display:block}
.mgwrap{max-width:520px;margin:0 auto;padding:14px}
.mghead{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.mghead h2{font-size:26px;flex:1;color:var(--yellow)}
.mghead .tag{font-size:12px;font-weight:800;background:rgba(255,255,255,.1);padding:5px 9px;border-radius:999px}
.mgstage{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:14px;min-height:400px;position:relative;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.mgstage canvas{display:block;width:100%;border-radius:14px;touch-action:none}
.mgstage p{color:#dfe6ef}
.count{font-family:var(--display);font-size:110px;text-align:center;padding:40px 0 10px;color:var(--yellow)}
.bigtxt{font-family:var(--display);font-size:44px;text-align:center}
.hint{text-align:center;color:#b9c4d2;font-weight:700;margin:6px 0}
.pedal{display:block;margin:14px auto 0;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7a7e,#d6333a);color:#fff;border:0;box-shadow:inset 0 -10px 0 rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.4);font-family:var(--display);font-size:30px;touch-action:manipulation}
.pedal:active{transform:scale(.96)}
.gbar{position:relative;height:56px;border-radius:14px;background:linear-gradient(90deg,#E5484D,#FFC83D 50%,#1FA35C);margin:24px 0 10px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.gzone{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.8)}
.gneedle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:#151B24;border-radius:3px;box-shadow:0 0 0 2px #fff}
.tapzone{width:100%;min-height:170px;border:0;border-radius:20px;background:rgba(255,255,255,.1);color:#fff;font-family:var(--display);font-size:28px;margin-top:10px;touch-action:manipulation}
.tapzone:active{background:rgba(255,255,255,.18)}
.light{width:140px;height:140px;border-radius:50%;margin:18px auto;background:#3a1618;box-shadow:inset 0 -8px 0 rgba(0,0,0,.3)}
.light.red{background:radial-gradient(circle at 40% 35%,#ff8a8d,#E5484D);box-shadow:0 0 40px #E5484D}
.light.green{background:radial-gradient(circle at 40% 35%,#7cf0a8,#1FA35C);box-shadow:0 0 50px #1FA35C}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.pad{height:130px;border:0;border-radius:22px;opacity:.45;transition:opacity .1s,transform .1s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.pad.lit{opacity:1;transform:scale(1.04)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{border:0;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;font-family:var(--display);font-size:30px;padding:18px 0}
.arrowq{font-size:110px;text-align:center;line-height:1;margin:14px 0;font-family:var(--display);color:var(--yellow)}
.restable{width:100%;border-collapse:collapse}
.restable td{padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:700}
.restable td.aw{text-align:right;font-family:var(--display);font-weight:400;color:var(--yellow);white-space:nowrap}
.restable small{font-weight:500;color:#b9c4d2}
.sheet .restable td{border-bottom-color:var(--line)}
.sheet .restable td.aw{color:var(--ink)}
.sheet .restable small{color:var(--muted)}
.pass{text-align:center;padding:30px 6px}
.pass img{width:200px;max-width:70%}
#mg.live{background:none;overflow:hidden}
body.mglive .hudtop,body.mglive .hudbot,body.mglive #fx{display:none}
#mg.live>*{pointer-events:auto}
.m3top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;gap:8px;align-items:center;max-width:560px;margin:0 auto}
.m3lb{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 58px);background:var(--hud);border:1px solid var(--hudline);border-radius:14px;padding:6px 10px;font-size:12px;font-weight:700;color:#fff;min-width:118px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.m3lb div{display:flex;gap:6px;align-items:center;padding:2px 0}.m3lb span{flex:1;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m3lb i{width:8px;height:8px;border-radius:50%;flex:none}.m3lb .me{color:var(--yellow)}.m3lb .out{opacity:.45;text-decoration:line-through}
.m3intro{position:absolute;left:10px;right:140px;top:calc(env(safe-area-inset-top,0px) + 58px);background:var(--hud);border:1px solid var(--hudline);color:#fff;border-radius:18px;padding:14px;max-width:420px}
.m3intro h3{color:var(--yellow);font-size:20px;margin-bottom:6px}.m3intro p{font-size:14px;line-height:1.45}.m3ctl{margin-top:8px;color:#b9c4d2;font-weight:700}
.m3center{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none!important}
.m3big{font-family:var(--display);font-size:110px;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.45);line-height:1}
.m3msg{display:inline-block;margin-top:10px;background:var(--hud);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800}
.m3ready{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--hud);border:1px solid var(--hudline);border-radius:22px;padding:16px;color:#fff;max-width:520px;margin:0 auto;z-index:3;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.m3ready h3{color:var(--yellow);font-size:20px;margin-bottom:8px}
#m3rl{margin-bottom:12px}#m3rl div{display:flex;gap:8px;align-items:center;padding:6px 0;font-weight:700;border-bottom:1px solid var(--hudline)}
#m3rl i{width:10px;height:10px;border-radius:50%;flex:none}#m3rl span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#m3rl b{color:#b9c4d2;font-size:13px}#m3rl b.ok{color:#7cf0a8}
.m3pad{position:absolute;left:0;right:0;bottom:0;height:58%;touch-action:none}
.knob{position:absolute;width:124px;height:124px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(16,22,31,.22);transform:translate(-50%,-50%);pointer-events:none}
.knob i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ram{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:100px;height:100px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#ff8a8d,#E5484D);color:#fff;font-family:var(--display);font-size:20px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.35);touch-action:manipulation;z-index:2}
.ram.cd{opacity:.4}
.tapall{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);height:21%;border-radius:26px;background:rgba(16,22,31,.28);color:#fff;font-family:var(--display);font-size:34px;border:2px solid rgba(255,255,255,.4);touch-action:manipulation}
.tapall:active{background:rgba(255,200,61,.45)}
#mg.res{background:rgba(8,20,14,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px}
body.mgres .hudtop,body.mgres .hudbot{display:none}
.resx{width:100%;max-width:440px;animation:pop .35s ease-out}
.rescard{position:relative;background:linear-gradient(170deg,#12925F,#0B6647);color:#fff;border-radius:26px;padding:22px 18px 16px;box-shadow:0 22px 60px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.9),inset 0 0 0 7px #0B6647;overflow:hidden}
.reshz{position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(-45deg,#FFC83D 0 12px,#151B24 12px 24px)}
.reshead{text-align:center;margin:6px 0 14px}

	if (!GFX.ok) return;
	const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
	lastT = performance.now();
	if (document.hidden) return;
	/* small FPS readout in the corner (averaged over half a second) */
	{
		const f = GFX.fps || (GFX.fps = { n: 0, t: t, el: null });
		f.n++;
		if (t - f.t > 500) {
			if (!f.el) {
				f.el = document.createElement("div");
				f.el.id = "fps";
				document.body.appendChild(f.el);
			}
			f.el.textContent = Math.round((f.n * 1000) / (t - f.t)) + " fps";
			f.n = 0;
			f.t = t;
		}
	}
	/* board: shadows are only re-rendered on frames where something that casts one moved (shadowNeeded, set by stepBoard); every other mode (minigames, editor, podium) renders shadows every frame */
	GFX.r.shadowMap.autoUpdate = !(GFX.mode === "board" && G && GFX.board);
	if (GFX.mode === "edit") {
		if (ED)
			try {
				edFrame(dt, t / 1000);
			} catch (e) {
				console.error(e);
			}
		return;
	}
	if (GFX.mode === "mg") {
		if (TVS) {
			try {
				tvsFrame();
			} catch (e) {
				console.error(e);
			}
			return;
		}
		if (W) {
			const now = performance.now(),
				real = Math.min(1, (now - (GFX.mgLast || now)) / 1000);
			GFX.mgLast = now;
			const n = Math.max(1, Math.ceil(real / 0.034));
			try {
				for (let i = 0; i < n && W; i++) stepMG(real / n);
			} catch (e) {
				console.error(e);
			}
			if (W) renderMG(W.sc, GFX.cam);
		}
		return;
	}
	if (mgOpen && !mgRes) return;
	if (GFX.ctl && !GFX.peek) return;
	const time = t / 1000;
	if (GFX.mode === "board" && G && GFX.board) {
		stepBoard(dt, time);
		stepDie(dt);
		if (GFX.board.shadowDirty !== false) {
			GFX.r.shadowMap.needsUpdate = true;
		}
		renderMG(GFX.board.scene, GFX.cam);
	} else if (GFX.mode === "podium" && GFX.pod) {
		stepPodium(dt);
		swayStep(GFX.pod.scene);
		renderMG(GFX.pod.scene, GFX.cam);
	} else if (GFX.show) {
		const S = GFX.show;
		{
			const dim = ["lobby", "home", "join", "practice"].includes(view),
				kk = Math.min(1, dt * 3);
			if (GFX.showSun) GFX.showSun.intensity += ((dim ? 0.72 : 1.05) - GFX.showSun.intensity) * kk;
			if (GFX.showHemi) GFX.showHemi.intensity += ((dim ? 0.6 : 0.78) - GFX.showHemi.intensity) * kk;
		}
		S.hold.rotation.y = S.single ? time * 0.45 : Math.sin(time * 0.3) * 0.15;
		S.hold.children.forEach((g) => {
			animTruck(g, dt);
			if (g.userData.bob !== undefined) g.position.y = Math.abs(Math.sin(time * 3 + g.userData.bob)) * 0.08;
		});
		S.clouds.forEach((c) => {
			c.position.x += dt * 0.5;
			if (c.position.x > 40) c.position.x = -40;
		});
		const cam = GFX.cam,
			asp = GFX.w / GFX.h,
			n = S.hold.children.length,
			home = view === "home",
			w = GFX.w,
			h = GFX.h;
		const d = asp < 1 ? (n > 1 ? 17 + n * 1.3 : 19) : n > 1 ? 11 + n * 0.5 : 10.5;
		cam.position.set(0, 1.2 + d * 0.3, d);
		cam.lookAt(0, 0.9, 0);
		cam.setViewOffset(w, h, home && n === 1 ? -w * (asp < 1 ? 0.16 : 0.12) : 0, h * (home ? 0.2 : 0.32), w, h);
		cam.updateProjectionMatrix();
		cam.updateMatrixWorld();
		swayStep(S.scene);
		renderMG(S.scene, cam);
	}
}
function gfxInit() {
	if (typeof THREE === "undefined") return;
	try {
		/* phones: no logarithmic depth buffer (it turns off early depth rejection on mobile GPUs and its precision fallback made specks shimmer through the lava) */
		const touch = !(typeof matchMedia === "function" && matchMedia("(pointer: fine)").matches);
		GFX.touch = touch;
		const r = new THREE.WebGLRenderer({
			canvas: $("#gl"),
			antialias: true,
			powerPreference: "high-performance",
			logarithmicDepthBuffer: !touch,
		});
		r.setPixelRatio(Math.min(devicePixelRatio || 1, 2.5));
		r.shadowMap.enabled = true;
		r.shadowMap.type = THREE.PCFSoftShadowMap;
		GFX.r = r;
		GFX.cam = new THREE.PerspectiveCamera(40, 1, 0.5, 240);
		GFX.ok = true;
		makeThumbs();
		buildShowroom();
		buildPodium();
		gfxResize();
		addEventListener("resize", gfxResize);
		requestAnimationFrame(frame);
	} catch (e) {
		console.warn("3D unavailable", e);
		GFX.ok = false;
	}
}
/* iPhone Safari ignores user-scalable=no: block pinch / gesture zoom everywhere, and double-tap zoom on the controller and minigame screens (controls fire on pointerdown, so fast repeated taps still count) */
document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturechange", (e) => e.preventDefault(), { passive: false });
document.addEventListener(
	"touchmove",
	(e) => {
		if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) e.preventDefault();
	},
	{ passive: false },
);
{
	let lastEnd = 0;
	document.addEventListener(
		"touchend",
		(e) => {
			const now = Date.now(),
				b = document.body.classList;
			if (now - lastEnd < 350 && (b.contains("mglive") || b.contains("ctl"))) e.preventDefault();
			lastEnd = now;
		},
		{ passive: false },
	);
}
/* Android: short buzz on button presses on the phone controller and in minigames (iPhone Safari has no vibration API) */
document.addEventListener(
	"pointerdown",
	(e) => {
		const b = document.body.classList;
		if (!navigator.vibrate || !(b.contains("ctl") || b.contains("mglive") || b.contains("tvphone"))) return;
		const t = e.target.closest && e.target.closest("button");
		if (t && !t.disabled) {
			try {
				navigator.vibrate(10);
			} catch (x) {}
		}
	},
	true,
);

const uniq = (m) => {

	return m;
};
const CBG = {};
function chamferBoxSq(w, h, d, r, flat) {
	const key = [w, h, d, r].map((v) => v.toFixed(3)).join(",") + "|" + flat.join("");
	if (CBG[key]) return CBG[key];
	if (!THREE.ConvexGeometry) return chamferBox(w, h, d, r);
	const X = w / 2,
		Y = h / 2,
		Z = d / 2,
		R = (f) => !flat.includes(f),
		pts = [],
		e = 1e-6;
	for (const sx of [-1, 1])
		for (const sy of [-1, 1])
			for (const sz of [-1, 1]) {
				const fx = R(sx > 0 ? "px" : "nx"),
					fy = R(sy > 0 ? "py" : "ny"),
					fz = R(sz > 0 ? "pz" : "nz");
				for (const ix of [0, 1])
					for (const iy of [0, 1])
						for (const iz of [0, 1]) {
							const u = X - ix * r,
								v = Y - iy * r,
								t = Z - iz * r;
							if (fx && fy && u + v > X + Y - r + e) continue;
							if (fy && fz && v + t > Y + Z - r + e) continue;
							if (fx && fz && u + t > X + Z - r + e) continue;
							if (fx && fy && fz && u + v + t > X + Y + Z - 2 * r + e) continue;
							pts.push(new THREE.Vector3(sx * u, sy * v, sz * t));
						}
			}
	return (CBG[key] = new THREE.ConvexGeometry(pts));
}
function chamferBox(w, h, d, r) {
	const key = [w, h, d, r].map((v) => v.toFixed(3)).join(",");
	if (CBG[key]) return CBG[key];
	const hw = w / 2 - r,
		hh = h / 2 - r,
		c = r * 0.9,
		s = new THREE.Shape();
	s.moveTo(-hw + c, -hh);
	s.lineTo(hw - c, -hh);
	s.lineTo(hw, -hh + c);
	s.lineTo(hw, hh - c);
	s.lineTo(hw - c, hh);
	s.lineTo(-hw + c, hh);
	s.lineTo(-hw, hh - c);
	s.lineTo(-hw, -hh + c);
	s.closePath();
	const g = new THREE.ExtrudeGeometry(s, {
		depth: Math.max(0.001, d - 2 * r),
		bevelEnabled: true,
		bevelThickness: r,
		bevelSize: r,
		bevelSegments: 1,
		steps: 1,
	});

function chamferPrism(P, d, r, cs) {
	if (!THREE.ConvexGeometry) return null;
	const Q = [];
	P.forEach((p, i) => {
		const c = cs[i] || 0;
		if (!c) {
			Q.push(p);
			return;
		}
		[P[(i + P.length - 1) % P.length], P[(i + 1) % P.length]].forEach((q) => {
			const dx = q[0] - p[0],
				dy = q[1] - p[1],
				t = Math.min(c, Math.hypot(dx, dy) * 0.3) / Math.hypot(dx, dy);
			Q.push([p[0] + dx * t, p[1] + dy * t]);
		});
	});

			const dx = b[0] - a[0],
				dy = b[1] - a[1],
				l = Math.hypot(dx, dy);
			return [-dy / l, dx / l];
		},
		pts = [];
	Q.forEach((p, i) => {
		const n1 = nrm(Q[(i + Q.length - 1) % Q.length], p),
			n2 = nrm(p, Q[(i + 1) % Q.length]),
			k = r / (1 + n1[0] * n2[0] + n1[1] * n2[1]);

				new THREE.Vector3(p[0] + (n1[0] + n2[0]) * k, p[1] + (n1[1] + n2[1]) * k, (sz * d) / 2),
			),
		);
	});

function facBelt(g, x, z0, z1, y, col, cap, n = 3) {
	const L = z1 - z0,
		zc = (z0 + z1) / 2;
	g.add(
		B(0.38, 0.08, L, "#2A2F3A", x, y, zc),
		B(0.04, 0.12, L, "#FFC83D", x - 0.21, y + 0.03, zc),
		B(0.04, 0.12, L, "#FFC83D", x + 0.21, y + 0.03, zc),
	);
	[z0 + 0.08, z1 - 0.08].forEach((z) => g.add(B(0.3, y, 0.08, "#5A6272", x, y / 2, z)));
	const bats = Array.from({ length: n }, () => {
		const b = miniBat(col, cap);
		b.rotation.y = Math.PI / 2;
		g.add(b);
		return b;
	});
	return (time) =>
		bats.forEach((b, k) => {
			const u = (time * 0.18 + k / n) % 1;

			b.scale.setScalar(u < 0.08 ? u / 0.08 : u > 0.92 ? (1 - u) / 0.08 : 1);
		});
}

/* Volcano Quarry cargo: obsidian shards (crater-floor blues +1, obsidian +2) → ground into obsidian dust at a refinery (1 shard = 1 dust) → the factory melts 5 dust into a battery (+ 10 coins), or sells one for 50 coins */
/* no carry limits on shards or dust (the map is meant to get wild) */
const SHARD_MAX = 999,

	DUST_BAT = 5,
	DUST_COINS = 10,
	RAW_PRICE = 50,

const shardMap = () => !!((typeof G !== "undefined" && G && MAPS[G.map]) || MAP || {}).shards;

function addShards(p, k) {
	const got = Math.max(0, Math.min(k, SHARD_MAX - (p.shards | 0)));

	return { got, lost: k - got };
}
/* lava costs a shard (armor keeps the cargo safe too); returns a text fragment */
function loseShard(p) {
	if (!shardMap() || !(p.shards | 0) || has(p, "armor")) return "";

}
/* refinery: grinds every shard into a scoop of dust while the dust bag has room; returns how many */
function refine(p) {
	const k = Math.max(0, Math.min(p.shards | 0, DUST_MAX - (p.dust | 0)));

			delete offSince[p.key];

function lpCamWire() {

	let last = null;
	const on = (e) =>
		W && W.camOv && mg.classList.contains("lpmode") && !(e.target.closest && e.target.closest("#lpanel"));
	const pair = () => {
		const v = [...pts.values()];
		if (v.length < 2) return null;
		return { d: Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y), cx: (v[0].x + v[1].x) / 2, cy: (v[0].y + v[1].y) / 2 };
	};

		if (!on(e)) return;
		e.preventDefault();
		pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

		try {
			mg.setPointerCapture(e.pointerId);
		} catch (err) {}

		if (!pts.has(e.pointerId) || !on(e)) return;

			o = W.camOv;
		pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

			o.yaw -= (e.clientX - prev.x) * 0.008;
			o.pitch = Math.max(0.03, Math.min(1.5, o.pitch + (e.clientY - prev.y) * 0.006));
			return;

			const k = o.dist * 0.0022,
				cy = Math.cos(o.yaw),
				sy = Math.sin(o.yaw),
				dx = n.cx - last.cx,
				dy = n.cy - last.cy;

			o.t.z += sy * dx * k - cy * dy * k * Math.sin(o.pitch);
			o.t.y += dy * k * Math.cos(o.pitch);

	);

function buildPost(scene, cam) {

				bm.fragmentShader.replace(
					from,
					"gl_FragColor = vec4( vec3( mix( 1.0, result / ( 5.0 * 5.0 ), aoAmt ) ), 1.0 );",
				);

						q.isLine ||
						(q.material && q.material.transparent && q.material.depthWrite === false))
				) {
					q.visible = false;
					hid.push(q);
				}

function wireStick(get) {
	const pad = $("#m3pad"),
		knob = $("#knob");
	let o = null,
		pid = null;
	const upd = (e) => {
		const dx = e.clientX - o[0],
			dy = e.clientY - o[1],
			l = Math.hypot(dx, dy),
			m = Math.min(1, l / 55),
			s = l > 4 ? m / l : 0,
			i = get();
		if (i) {
			i.x = dx * s;
			i.y = dy * s;
		}
		knob.firstChild.style.transform = `translate(${(dx / Math.max(1, l)) * Math.min(l, 50)}px,${(dy / Math.max(1, l)) * Math.min(l, 50)}px)`;
	};
	pad.addEventListener("pointerdown", (e) => {
		e.preventDefault();
		pid = e.pointerId;
		o = [e.clientX, e.clientY];
		pad.setPointerCapture(pid);
		knob.hidden = false;
		knob.style.left = e.clientX + "px";
		knob.style.top = e.clientY - pad.getBoundingClientRect().top + "px";
		upd(e);
	});
	pad.addEventListener("pointermove", (e) => {
		if (e.pointerId === pid && o) upd(e);
	});
	const end = (e) => {
		if (e.pointerId !== pid) return;
		o = null;
		pid = null;
		knob.hidden = true;
		const i = get();
		if (i) {
			i.x = 0;
			i.y = 0;
		}
	};
	pad.addEventListener("pointerup", end);
	pad.addEventListener("pointercancel", end);
}

/* ---------- ram loot: rammed trucks spill coins anyone can grab ---------- */
function addDrop(W, id, x, z, fx, fz, v = 1) {
	if (!W || !W.items || !isFinite(id) || !isFinite(x) || !isFinite(z)) return;
	W.itemMap = W.itemMap || {};
	if (W.itemMap[id]) return;
	let m;
	if (W.def.dropMesh) m = W.def.dropMesh(v);
	else {
		m = mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.14, 14), "#FFC83D", {
			metalness: 0.5,
			roughness: 0.3,
			emissive: "#6A4E00",
			emissiveIntensity: 0.4,
		});
		m.rotation.z = Math.PI / 2;
	}
	m.position.set(fx, 1, fz);
	W.sc.add(m);
	const it = {
		id,
		x,
		z,
		fx: isFinite(fx) ? fx : x,
		fz: isFinite(fz) ? fz : z,
		born: W.t,
		t: W.t + 0.5,
		m,
		v,
		drop: true,
	};
	W.items.push(it);
	W.itemMap[id] = it;
}
function dropLoot(W, e, by) {
	const d = W.def;
	if (d.onRammed) {
		if (e.local && !e.d) d.onRammed(W, e, by);
		return;
	}
	if (!d.loot || e.d || !e.local || (e.lootCD || 0) > W.t) return;
	let share = 0.3,
		flank = "";
	if (e.hitAng) {
		const fx = Math.cos(e.yaw),
			fz = -Math.sin(e.yaw),
			dot = e.hitAng[0] * fx + e.hitAng[1] * fz;
		if (dot > 0.5) {
			share = 0.5;
			flank = "rear";
		} else if (dot > -0.5) {
			share = 0.4;
			flank = "side";
		}
	}
	const per = d.lootPer || 1;
	let k;
	if (per > 1) {
		const stack = Math.floor(e.sc / per);
		if (!stack) return;
		k = Math.min(stack, Math.max(1, Math.ceil(stack * (share + 0.2))));
	} else k = Math.min(flank === "rear" ? 8 : 6, e.sc, Math.max(2, Math.ceil(e.sc * share)));
	if (k <= 0) return;
	e.lootCD = W.t + 1;
	e.sc -= k * per;
	e.lootN = e.lootN || 0;
	e.dr = e.dr || [];
	const h = (d.bound && d.bound.h ? d.bound.h : 11) - 0.8;
	for (let i = 0; i < k; i++) {
		const a = Math.random() * 6.28,
			r = 2.1 + Math.random() * 1.5,
			x = Math.max(-h, Math.min(h, e.x + Math.cos(a) * r)),
			z = Math.max(-h, Math.min(h, e.z + Math.sin(a) * r));
		const id = 100000 + e.i * 1000 + (e.lootN++ % 1000);
		addDrop(W, id, x, z, e.x, e.z, per);
		e.dr.push([id, Math.round(x * 100) / 100, Math.round(z * 100) / 100, per]);
	}
	if (e.dr.length > 30) e.dr = e.dr.slice(-30);
	if (e.isMe) {
		e.lastDrop = { t: W.t, n: k, flank, what: per > 1 ? "cone" : "coin" };
		sfx("loss");
	}
}

function ramAssist(W, e, dx, dz) {
	let best = null,
		bs = 1e9;
	for (const o of W.list) {
		if (o === e || o.gone || !o.al || o.d || o.falling || o.fly || (!o.local && !o.seen)) continue;
		const ox = o.x - e.x,
			oz = o.z - e.z,
			d = Math.hypot(ox, oz);
		if (d > 6.5 || d < 0.3) continue;
		const cos = (ox * dx + oz * dz) / d;
		if (cos < 0.5) continue;
		const sc = d * (2 - cos);
		if (sc < bs) {
			bs = sc;
			best = [ox / d, oz / d];
		}
	}
	return best;
}

}

			lp.frequency.setTargetAtTime(350 + spd * 1600, t, 0.08);

			new THREE.PlaneGeometry(0.26, 0.5),
			new THREE.MeshBasicMaterial({
				transparent: mul || op < 1,
				opacity: op,
				blending: mul ? THREE.MultiplyBlending : THREE.NormalBlending,

		c = new THREE.Color(col);

		N,

		fade,

		prompt: (W, e) => (e.msg && W.t - e.msgT < 1.4 ? e.msg : ""),
		donePrompt: (W, e) => (e.f && e.f.run ? "Caught on red!" : e.fin ? `Finished in ${e.fin.toFixed(2)} s` : ""),
		render(W, e, dt) {
			if (W.lampT !== W.t) {
				W.lampT = W.t;
				this.walkPeds(W, dt, W.t > 0 && this.light(W, W.t) === "r");
				const st = W.t < 0 ? "r" : this.light(W, W.t);
				W.lamps.forEach((l) => {
					l[0].material.emissiveIntensity = st === "r" ? 1.6 : 0;
					l[1].material.emissiveIntensity = st === "y" ? 1.6 : 0;
					l[2].material.emissiveIntensity = st === "g" ? 1.6 : 0;
				});
				const b = document.getElementById("rlgl");
				if (b) {
					const me = W.me,
						ds = me.d ? "done" : st === "g" ? "go" : st === "y" ? "yel" : "red";
					if (b.dataset.state !== ds) b.dataset.state = ds;
					setTxt(
						"rlglh",
						me.fin
							? "Finished!"
							: me.d
								? "Caught!"
								: st === "g"
									? me.hold
										? "Driving…"
										: "GREEN: hold to drive!"
									: st === "y"
										? "YELLOW: let go!"
										: "RED: stop!",
					);
				}
			}
			// caught trucks: the speed camera flashes, then a lorry thunders down their lane
			const run = e.f && e.f.run;
			if (!run) return;
			const age = W.t - run;
			if (e.hz === undefined) e.hz = e.z;
			if (!W.lorries[e.k]) {
				const lo = this.lorry(W);
				lo.position.x = e.x;
				W.lorries[e.k] = lo;
				burst(W.sc, e.x, 4, e.hz + 2, {
					n: 12,
					shape: "cube",
					cols: ["#FFFFFF", "#FFF3C0"],
					spd: 4,
					up: 2,
					grav: 0,
					life: 0.35,
				});
				if (Math.abs(e.hz - W.me.z) < 40) sfx("honk");
			}
			const lo = W.lorries[e.k],
				lz = e.hz + 46 - age * 34;
			lo.position.z = lz;
			lo.visible = lz > e.hz - 90;
			if (lz - 4.7 <= e.hz + 1 && !e.fly) {
				e.fly = { vy: 11, vz: -16, s: 0 };
				burst(W.sc, e.x, 1, e.hz, {
					n: 18,
					shape: "cube",
					cols: ["#8E96A3", "#FFC83D", "#2A2F3A"],
					spd: 5,
					up: 6,
					life: 0.9,
				});
				if (Math.abs(e.hz - W.me.z) < 40) sfx("crush");
				if (e.isMe) W.shake = 0.5;
			}
			if (e.fly) {
				const f = e.fly;
				f.vy -= 30 * dt;
				e.y = Math.max(0, (e.y || 0) + f.vy * dt);
				e.z += f.vz * dt;
				f.vz *= Math.exp(-1.5 * dt);
				f.s += dt * 9;
				e.spin = e.y > 0 ? f.s : 0;
				if (e.y <= 0 && f.vy < 0) e.tr.scale.y = Math.max(0.35, e.tr.scale.y - dt * 4);
			}
		},
		lorry(W) {
			const g = new THREE.Group();
			g.add(
				B(2.6, 3.2, 3, "#E5484D", 0, 2, -3.2),
				B(2.5, 1.2, 0.1, "#9FD8FF", 0, 2.8, -4.72),
				B(2.8, 3.8, 11, "#F4F6F9", 0, 2.6, 4.2),
				B(2.9, 0.6, 11.1, "#2F7DE1", 0, 1.1, 4.2),
			);
			[-3.6, -1, 2.2, 6.4, 8.4].forEach((z) =>
				[-1.25, 1.25].forEach((x) => {
					const w = Cy(0.6, 0.6, 0.5, 12, "#1D2230", x, 0.6, z);
					w.rotation.z = Math.PI / 2;
					g.add(w);
				}),
			);
			W.sc.add(g);
			return g;
		},
		bot(W, e) {
			const L = this.light(W, W.t),
				c = W.cyc.findIndex((c) => W.t < c.r);
			e.plan = e.plan || {};
			if (e.plan[c] === undefined) e.plan[c] = Math.random() < 0.12 ? 1.1 : 0.1 + Math.random() * 0.45;
			e.hold =
				L === "g" ||
				(L === "y" && W.t - W.cyc[c].g < e.plan[c]) ||
				(L === "r" && e.plan[c] > 1 && this.redFor(W, W.t) < 0.5);
		},
		ctlHTML() {
			return `<button class="tapall tp-launch" id="rlgl" data-state="wait" aria-label="Hold to drive"><span class="tp-lights"><i class="r"></i><i class="y"></i><i class="g"></i></span><span class="tp-go">GAS</span><b class="tp-hint" id="rlglh">Wait for green…</b></button>`;
		},
		wire() {
			cxWireBtn(
				document.getElementById("rlgl"),
				() => {
					if (W && W.t >= 0 && !W.me.d) W.me.hold = true;
				},
				() => {
					if (W) W.me.hold = false;
				},
			);
		},
		onKey(W, k, down) {
			if ([" ", "enter", "w", "arrowup"].includes(k)) W.me.hold = down;
		},
		botScore: () => 40 + rnd(1000),
	},
	park: {

			[-1, 1].forEach((sd) => {

			const PF = -30,

					m.position.set(

			[
				[-26, 0.22],

		excavator(s, x, z) {
			// tracks, rotating house with cab and counterweight, boom, stick, toothed bucket

				g = new THREE.Group();

			house.rotation.y = Math.PI;

				B(1.8, 0.8, 1.9, Y, 0, 0.45, -0.1),

		// poses: [house yaw, boom pitch, stick pitch (relative), bucket curl]; over the bed, at the pile, and the dump tip
		POSE: {
			bed: [Math.PI, -1.02, 1.44, 0.9],
			pile: [0, -0.25, 1.45, -0.3],
			dug: [0, -0.4, 1.45, 0.9],
			tip: [Math.PI, -1.02, 1.44, -0.7],
		},
		pose(x, a, b, k) {
			k = Math.max(0, Math.min(1, k));
			const m = (i, w) => a[i] + (b[i] - a[i]) * w,
				w = k * k * (3 - 2 * k);
			x.house.rotation.y = m(0, w);
			x.boom.rotation.x = m(1, w);
			x.stick.rotation.x = m(2, w);
			x.bucket.rotation.x = m(3, w);
		},
		digStep(W, dt) {
			// one big scoop from the pile, then hover over the bed and pour while the load counts up
			const P = this.POSE;
			W.exc.forEach((x, i) => {
				const e = W.list.find((q) => q.i === i);
				if (!(e && e.local && e.ph === "load") || W.t < 0) {
					this.pose(x, x.bedP || P.bed, x.bedP || P.bed, 1);
					x.dirt.visible = false;
					return;
				}
				// taller trucks sit higher: lift the boom so the bucket clears a full heap (about 0.8 above the bed floor)
				if (e.bed && x.forK !== e.k) {
					x.forK = e.k;
					const fy = e.bed.getWorldPosition(new THREE.Vector3()).y + 1.2,
						mk = (b, d) => [b[0], b[1] - 0.35 * d, b[2] - 0.35 * d, b[3]];
					let lo = 0,
						hi = 1.6;
					for (let it = 0; it < 12; it++) {
						const mid = (lo + hi) / 2;
						this.pose(x, mk(P.bed, mid), mk(P.bed, mid), 1);
						x.house.updateMatrixWorld(true);
						if (new THREE.Box3().setFromObject(x.bucket).min.y < fy) lo = mid;
						else hi = mid;
					}
					x.bedP = mk(P.bed, hi);
					x.tipP = mk(P.tip, hi);
				}
				const BP = x.bedP || P.bed,
					TP = x.tipP || P.tip;
				const tt = W.t - e.phT,
					T0 = this.POUR0;
				if (tt < 0.5) {
					this.pose(x, BP, P.pile, tt / 0.5);
					x.dirt.visible = false;
				} else if (tt < 0.85) {
					this.pose(x, P.pile, P.dug, (tt - 0.5) / 0.35);
					x.dirt.visible = tt > 0.7;
					x.dirt.scale.setScalar(1);
				} else if (tt < T0) {
					this.pose(x, P.dug, BP, (tt - 0.85) / (T0 - 0.85));
					x.dirt.visible = true;
				} else {
					const p = Math.min(1, (tt - T0) / (this.LOADT * this.MAXL));
					this.pose(x, BP, TP, Math.min(1, p * 3));
					x.dirt.visible = p < 0.97;
					x.dirt.scale.setScalar(Math.max(0.05, 1 - p));
					if (e.load < this.MAXL && Math.random() < dt * 30) {
						const b = x.bucket.getWorldPosition(new THREE.Vector3());
						burst(W.sc, b.x + (Math.random() - 0.5) * 0.4, b.y - 0.35, b.z + (Math.random() - 0.5) * 0.3, {
							n: 1,
							shape: "cube",
							cols: ["#8C6A45", "#6B4F35", "#A07C58"],
							spd: 0.3,
							up: 0.1,
							grav: 16,
							life: 0.42,
							size: 0.7,
						});
					}
				}
			});
		},
		spawn: (W, i) => ({ x: W.laneX(i), z: MG.park.HOME, yaw: Math.PI / 2 }),
		SPIN: 0.6,
		PIV: 0.7,
		LOADT: 0.5,
		POUR0: 1.45,
		initEnt(W, e) {
			e.ph = "load";
			e.phT = 0;

			e.v = 0;
			e.yaw = Math.PI / 2;
		},
		go(W, e) {
			if (e.d || W.t < 0) return;
			if (e.ph === "load" && e.load > 0) {
				e.ph = "drive";
				e.phT = W.t;
				e.v = 2;
			} else if (e.ph === "drive") this.spin(W, e, -1, "dump");
		},
		rules(W, e, dt) {
			if (e.d) return;
			const E = this.EDGE;
			if (e.ph === "drive") {
				e.yaw = Math.PI / 2;
				e.v = Math.min(13, e.v + 4.5 * dt);
				e.z -= e.v * dt;
				e.vz = -e.v;
				if (e.z - 1 - E < -1) this.over(W, e);
			} else if (e.ph === "spin") {
				const brake = e.snext === "dump"; // braking slide both ways: the turn finishes exactly as the truck stops
				e.v = Math.max(0, e.v - 14 * dt);
				const k = Math.max(Math.min(1, (W.t - e.phT) / this.SPIN), 1 - e.v / e.sv0),
					ease = k * k * (3 - 2 * k);
				e.yaw = e.sy0 + Math.PI * ease * e.sdir;
				e.pz += e.sgo * e.v * dt;
				e.vz = e.sgo * e.v;
				e.x = e.px - Math.cos(e.yaw) * this.PIV;
				e.z = e.pz + Math.sin(e.yaw) * this.PIV;
				if (brake && e.z - 1 - E < -1) this.over(W, e);
				else if (k >= 1 && e.v === 0) {
					e.x = W.laneX(e.i);
					e.yaw = e.sy0 + Math.PI * e.sdir;
					e.ph = e.snext;
					e.phT = W.t;
					if (e.ph === "load") {
						e.z = this.HOME;
						e.v = 0;
						e.vz = 0;
					} else this.land(W, e, e.z - 1 - E);
				}
			} else if (e.ph === "load") {
				e.vz = 0;
				if (W.t - e.phT > this.POUR0 + this.LOADT * (e.load + 1) && e.load < this.MAXL) {
					e.load++;
					if (e.isMe) sfx("step");
				}
			} else if (e.ph === "dump") {
				e.vz = 0;
				if (W.t - e.phT > 1.3) {
					e.load = 0;
					e.v = 0;
					e.ph = "back";
					e.phT = W.t;
				}
			} else if (e.ph === "back") {
				e.yaw = -Math.PI / 2;
				e.v = Math.min(12, (e.v || 0) + 8 * dt);
				e.z += e.v * dt;
				e.vz = e.v;
				if (this.HOME - e.z <= (e.v * e.v) / 28 + 2 * this.PIV) this.spin(W, e, 1, "load");
			} else if (e.ph === "fall") {
				e.vy -= 30 * dt;
				e.y = Math.max(-29.4, e.y + e.vy * dt);
				if (e.y > -29.4) {
					e.z -= 3 * dt;
					e.spin = (W.t - e.phT) * 3;
				}
				if (W.t - e.phT > 2.6) {
					e.y = 0;
					e.vy = 0;
					e.spin = 0;
					e.z = this.HOME;
					e.yaw = Math.PI / 2;
					e.v = 0;
					e.g.visible = true;
					e.load = 0;
					e.ph = "load";
					e.phT = W.t;
				}
			}
		},
		over(W, e) {
			e.ph = "fall";
			e.phT = W.t;
			e.vy = 0;

				e.msg = "Over the edge! −20";
				e.msgT = W.t;

		land(W, e, gap) {

			e.pz = e.z - Math.sin(e.yaw) * this.PIV;

			e.snext = next;

			});

				p.g.visible = !e.got.has(p.id);

			if (e.think <= 0 && near(lane)) {

						for (let k = -1; k < e.st.length - 1; k++) {

								sx = k < 0 ? 0 : e.st[k],
								lim = k < 0 ? 0.8 : 0.5;

								e.st = e.st.slice(0, k + 1);
								e.pt = e.pt.slice(0, k + 1);
								e.tot -= lost;
								e.pmsg = `Toppled! −${lost}`;
								e.tip = { x: e.fall.x, y: bed + 0.4, dir: Math.sign(com - sx) || 1, n: e.used };

						u: e.used,
						tip: e.tip

				}
				pa.needsUpdate = true;
				W.sea.geometry.computeVertexNormals();
			}
			if (W.tumT !== W.t) {
				const dt = Math.min(0.05, Math.max(0, W.t - (W.tumT ?? W.t)));
				W.tumT = W.t;
				(W.tumb || []).forEach((b) => {
					b.t += dt;
					if (b.t > 7) {
						b.m.visible = false;
						return;
					}
					if (!b.rest) {
						b.vy -= 22 * dt;
						b.m.position.x += b.vx * dt;
						b.m.position.y += b.vy * dt;
						b.m.position.z += b.vz * dt;
						b.m.rotation.z += b.wz * dt;
						b.m.rotation.x += b.wx * dt;
						if (b.m.position.y < 0.4) {
							b.m.position.y = 0.4;
							if (Math.abs(b.vy) > 3) {
								b.vy *= -0.3;
								b.vx *= 0.6;
								b.wz *= 0.5;
							} else {
								b.rest = true;
								b.m.rotation.z = (Math.round(b.m.rotation.z / (Math.PI / 2)) * Math.PI) / 2;
								b.m.rotation.x = 0;
							}
						}
					}
				});
			}
			const L = e.local ? e.st : e.f.st || [],
				cr = L.length,
				h = W.hooks[e.k];
			e.g.position.x = this.truckX(W, e, cr);

				W.tumb = W.tumb || [];
				if (m.parent) m.parent.remove(m);
				m.position.set(wx, wy, -11);
				W.sc.add(m);

					m,
					t: 0,
					vx: dir * (1.6 + Math.random()),
					vy: 1.5 + Math.random(),
					vz: (Math.random() - 0.5) * 1.2,
					wz: -dir * (3 + Math.random() * 3),
					wx: (Math.random() - 0.5) * 2,
				});
			};
			while (e.stack.length > cr) {
				const m = e.stack.pop(),
					i = e.stack.length,
					lean = (L.length ? m.position.x - L[L.length - 1] : m.position.x) || Math.random() - 0.5;
				tumble(m, e.g.position.x + m.position.x, m.position.y, Math.sign(lean) || 1);
			}
			while (e.stack.length < cr) {
				const i = e.stack.length,
					b = B(1, 0.8, 1, i % 2 ? "#D99A5B" : "#C98A4B", L[i], this.top(i) + 0.4, 0);
				b.rotation.z = Math.max(-0.12, Math.min(0.12, -(L[i] - (i ? L[i - 1] : 0)) * 0.25));
				e.g.add(b);
				e.stack.push(b);
			}
			e.stack.forEach((b, i) => {
				b.position.x = L[i];
			});
			{
				const tp = e.local ? (e.tip ? [e.tip.x, e.tip.dir, e.tip.n, e.tip.y] : null) : e.f.tip;
				if (tp && tp[2] !== e.tipSeen) {
					e.tipSeen = tp[2];
					const m = B(1, 0.8, 1, "#C98A4B", 0, 0, 0);
					tumble(m, tp[0], tp[3] ?? this.top(cr) + 0.4, tp[1]);
				}
			}
			if (h) {
				const cy = this.dropY(Math.min(cr, 9)) + 0.4,
					L = Math.max(0.1, 15 - (cy + 0.4));
				h.position.set(W.laneX(e.i) + this.hookX(W, e, cr), cy, -11);
				h.userData.cab.scale.y = L;
				h.userData.cab.position.y = 0.4 + L / 2;
				h.userData.cr.visible = (e.local ? e.used : e.f.u || 0) < 10 && !(e.local && e.fall);
			}
			while (e.stack.length < cr) {
				const b = B(
					1,
					0.8,
					1,
					e.stack.length % 2 ? "#D99A5B" : "#C98A4B",
					e.f.lo || 0,
					this.top(e.stack.length) + 0.4,
					0,
				);
				e.g.add(b);
				e.stack.push(b);
			}
			if (e.fall) {
				if (!e.fm) {
					e.fm = B(1, 0.8, 1, "#C98A4B", 0, 0, 0);
					W.sc.add(e.fm);
				}
				e.fm.visible = true;
				e.fm.position.set(e.fall.x, e.fall.y + 0.4, -11);
			} else if (e.fm) e.fm.visible = false;
		},
		final: (W, e) => e.tot,
		prompt: (W, e) => e.pmsg || "",
		bot(W, e) {
			if (e.fall || e.used >= 10) return;
			e.tol = e.tol ?? 0.06 + Math.random() * 0.34;
			const topX = this.truckX(W, e, e.cr) + (e.st.length ? e.st[e.st.length - 1] : 0);

		botScore: () => 350 + rnd(500),

	el.addEventListener("pointerdown", (e) => {
		e.preventDefault();
		el.classList.add("kick");
		down && down();
	});
	const end = (e) => {
		el.classList.remove("kick");

	};
	el.addEventListener("pointerup", end);

				} else if (fill >= 0.4 && fill <= 1.05) {

		render(W, e, dt) {

			});

				grate = e.hold && e.hold.ing === "cheese",
				sx = 0.55 + Math.sin(W.t * 2.6) * 0.25;

			W.grater.visible = !!grate;
			const tool = bottle ? W.bottle : grate ? W.grater : null;
			if (tool) {
				tool.position.set(sx, 3.25, Math.cos(W.t * 1.7) * 0.45);
				tool.rotation.z = bottle ? Math.PI * 0.85 : Math.sin(W.t * 20) * 0.08;

				}

				p.m.position.x += p.vx * dt;
				p.m.position.z += p.vz * dt;
				p.m.position.y += p.vy * dt;

					z = p.m.position.z,

				let gnd = onT ? base : -5;
				if (onT)
					for (const q of P)
						if (q.rest && Math.hypot(q.m.position.x - x, q.m.position.z - z) < 0.17)
							gnd = Math.max(gnd, q.m.position.y + q.sz);

					p.m.position.y = gnd + p.sz;
					if (onT && gnd - base > 0.22 && (p.slid || 0) < 4) {
						p.slid = (p.slid || 0) + 1;
						const a = Math.random() * 6.28;
						p.vx = Math.cos(a) * 1.4;
						p.vz = Math.sin(a) * 1.4;
						p.vy = 0.6;
						p.m.position.y += 0.02;
					} else if (p.vy < -2.5) {
						p.vy *= -0.3;
						p.vx *= 0.5;
						p.vz *= 0.5;
					} else {
						p.rest = true;
						p.m.rotation.x = (Math.random() - 0.5) * 0.5;
					}
				}
				if (p.m.position.y < -3) {

					p.rest = true;
				}

					pb.classList.toggle("over", f > 1.05);
				}

				.querySelectorAll(".cxing")

		puddle(W, x, z, rx, rz, y, mud) {

					rg.forEach(([px, pz]) => {
						P.push(px, yy, pz);
						Nn.push(0, 1, 0);

					});

				G.setAttribute("normal", new THREE.Float32BufferAttribute(Nn, 3));

						[1.42, 0.012],

			);
			W.garRings.forEach((rg, i) => {
				const hot = want.has(i),
					k = hot ? 0.12 : 0.04;
				rg.scale.setScalar(1 + Math.sin(W.t * (hot ? 7 : 4)) * k);
				rg.material.emissiveIntensity = hot ? 1.2 + Math.sin(W.t * 7) * 0.5 : 0.7;
				const [gx, gz] = rg.userData.at,
					under = W.list.some((q) => !q.gone && Math.abs(q.x - gx) < 3.4 && Math.abs(q.z - gz) < 3.4),
					u = rg.userData;
				u.fade += ((under ? 0.22 : 1) - u.fade) * Math.min(1, dt * 8);
				u.roof.forEach((m) => {
					m.opacity = u.fade;
					m.depthWrite = u.fade > 0.95;
				});
			});
			W.cars.forEach((c) => {
				const on = W.t >= c.t && !W.claimed.has(c.id);
				c.g.visible = on;
				c.pud.visible = false;
				c.line.visible = false;
				if (!on) return;
				const tw = this.towedBy(W, c.id);
				if (tw) {
					const bx = tw.x - Math.cos(tw.yaw) * 2.3,
						bz = tw.z + Math.sin(tw.yaw) * 2.3;
					c.g.position.x += (bx - c.g.position.x) * Math.min(1, dt * 12);
					c.g.position.z += (bz - c.g.position.z) * Math.min(1, dt * 12);
					c.g.position.y = 0.05;
					c.g.rotation.x *= Math.max(0, 1 - dt * 8);
					c.g.rotation.z *= Math.max(0, 1 - dt * 8);
					c.g.rotation.y = lerpA(c.g.rotation.y, tw.yaw, Math.min(1, dt * 8));
					const mx = (tw.x + c.g.position.x) / 2,
						mz = (tw.z + c.g.position.z) / 2,
						L = Math.hypot(tw.x - c.g.position.x, tw.z - c.g.position.z);
					c.line.visible = true;
					c.line.position.set(mx, 0.7, mz);
					c.line.scale.z = Math.max(0.1, L - 1.6);
					c.line.rotation.y = Math.atan2(tw.x - c.g.position.x, tw.z - c.g.position.z);
				} else {
					const [x, z] = this.carAt(W, c);
					c.g.position.x += (x - c.g.position.x) * Math.min(1, dt * 6);
					c.g.position.z += (z - c.g.position.z) * Math.min(1, dt * 6);
					c.g.position.y += (-0.2 - c.g.position.y) * Math.min(1, dt * 4);
					c.g.rotation.x += (c.tilt[0] - c.g.rotation.x) * Math.min(1, dt * 4);
					c.g.rotation.z += (c.tilt[1] - c.g.rotation.z) * Math.min(1, dt * 4);
					c.pud.visible = true;
					c.pud.position.set(c.g.position.x, 0.015, c.g.position.z);
					c.pud.rotation.y = c.g.rotation.y;
				}
			});
		},
		prompt: (W, e) =>
			e.msg && W.t - e.msgT < 1.4
				? e.msg
				: e.f && e.f.tow
					? `Tow it to the ${MG.tow.GAR[(W.cars[e.f.tow - 1] || {}).gi || 0][3]} garage!`
					: "",
		bot(W, e, dt) {
			const f = e.f;
			const rival = W.list.find(
				(o) => o !== e && !o.gone && o.al && o.f && o.f.tow && Math.hypot(o.x - e.x, o.z - e.z) < 4.5,
			);
			if (rival && !f.tow && e.bcd <= 0 && W.t > 2.5 && Math.random() < 0.03) {
				const s = steer(e, rival.x + (Math.random() - 0.5) * 1.5, rival.z + (Math.random() - 0.5) * 1.5, 1);
				s.boost = true;
				return s;
			}
			if (f.tow) {
				const G = this.GAR[(W.cars[f.tow - 1] || {}).gi || 0];
				return steer(e, G[0], G[1], 0.85);
			}
			const c = W.cars
				.filter((c) => W.t >= c.t && !W.claimed.has(c.id) && !this.towedBy(W, c.id))
				.map((c) => {
					const [x, z] = this.carAt(W, c);
					return { x, z };
				})
				.sort((a, b) => Math.hypot(a.x - e.x, a.z - e.z) - Math.hypot(b.x - e.x, b.z - e.z))[0];
			return c ? steer(e, c.x, c.z, 0.82) : wander(W, e, dt, 8);
		},
		botScore: () => 1 + rnd(5),
	},
});

/* shared drift handling: the truck turns toward the stick, side grip drops while it is swinging at speed; kick(e) returns extra forward speed when the RAM/NITRO button fires */
function driftPhys(W, e, inp, dt, kick) {
	const m = inp ? Math.hypot(inp.x, inp.y) : 0,
		y0 = e.yaw;
	let thr = 0;
	if (m > 0.2) {
		const sp0 = Math.hypot(e.vx, e.vz);
		let d = Math.atan2(-inp.y, inp.x) - e.yaw;
		d = Math.atan2(Math.sin(d), Math.cos(d));
		const rate = e.rateOv !== undefined ? e.rateOv : 1.8 + Math.min(1, sp0 / 7) * 2.6;
		e.yaw += Math.max(-rate * dt, Math.min(rate * dt, d));
		thr = Math.min(1, m) * (Math.abs(d) > 2.5 ? 0.25 : 1);
	}
	const fx = Math.cos(e.yaw),
		fz = -Math.sin(e.yaw),
		lx = -fz,
		lz = fx;
	let vf = e.vx * fx + e.vz * fz,
		vl = e.vx * lx + e.vz * lz;
	if (inp && inp.boost) vf += kick(e) || 0;
	if (inp) inp.boost = false;
	e.bcd = Math.max(0, e.bcd - dt);
	e.boostT = Math.max(0, e.boostT - dt);
	e.slideT = Math.max(0, (e.slideT || 0) - dt);
	const yr = Math.abs(e.yaw - y0) / Math.max(dt, 0.001),
		grip =
			e.slideT > 0
				? 0.5
				: e.gripOv !== undefined
					? e.gripOv
					: 3.4 - 2.6 * Math.min(1, yr / 2.4) * Math.max(0, Math.min(1, (vf - 5) / 5));
	vl *= Math.exp(-grip * dt);
	vf += thr * 19 * dt;
	vf *= Math.exp(-(thr ? 0.35 : 1.1) * dt);
	const sp = Math.hypot(vf, vl),
		cap = e.boostT > 0 || e.slideT > 0 ? e.capB || 21 : e.capOv || 14;
	if (sp > cap) {
		vf *= cap / sp;
		vl *= cap / sp;
	}
	e.vx = fx * vf + lx * vl;
	e.vz = fz * vf + lz * vl;
	e.x += e.vx * dt;
	e.z += e.vz * dt;
	e.spd = Math.min(sp, cap);
	e.slip = vf > 1 ? Math.atan2(Math.abs(vl), vf) : 0;
}

			});

				if (Math.abs(e.vx) > 4) e.bonk = 1;

				e.vx *= -0.45;

					nz = dz / dd,
					vn = e.vx * nx + e.vz * nz;

					t2 = " ×" + mu;
				x.font = "64px Bungee, 'Arial Black', Impact, sans-serif";
				const w1 = x.measureText(t1).width;
				x.font = "38px Bungee, 'Arial Black', Impact, sans-serif";
				const w2 = x.measureText(t2).width,
					tw = Math.min(w - 16, w1 + w2 + 40),
					x0 = (w - tw) / 2;
				x.fillStyle = "rgba(16,22,31,.82)";

				x.fill();
				x.strokeStyle = col;
				x.lineWidth = 5;
				rr(x, x0 + 2.5, 16.5, tw - 5, 79, 40);
				x.stroke();
				x.textBaseline = "middle";
				x.textAlign = "left";
				let cx = (w - w1 - w2) / 2;
				x.font = "64px Bungee, 'Arial Black', Impact, sans-serif";
				x.fillStyle = col;
				x.fillText(t1, cx, 60);
				x.font = "38px Bungee, 'Arial Black', Impact, sans-serif";
				x.fillStyle = "#FFFFFF";
				x.fillText(t2, cx + w1, 64);
				e.cbS.material.map.needsUpdate = true;
			}
			const k = Math.min(1, cb / 800),
				pul = 1 + (cb >= 400 ? Math.sin(W.t * 10) * 0.06 : 0),
				sc = (2.8 + k * 1.4) * pul;
			e.cbS.scale.set(sc, (sc * 112) / 320, 1);
			e.cbS.position.set(e.x, 3.7 + k * 0.4, e.z - 0.2);
		},
		zone(x, z) {
			return this.STK.some(([a, b]) => {
				const d = Math.hypot(x - a, z - b);
				return d > this.ZR[0] && d < this.ZR[1];
			});
		},
		bank(W, e) {
			const q = e.dk,
				v = Math.round(q.pts * q.mult);
			if (v > 0) {
				e.sc += v;
				if (e.isMe) {
					e.msg = `+${v}` + (q.mult > 1 ? `  (×${q.mult})` : "");
					e.msgT = W.t;
					sfx(v > 300 ? "battery" : "coin");
				}
			}
			q.pts = 0;
			q.mult = 1;
			q.run = 0;
			q.gap = 0;
		},
		lose(W, e, why) {
			const q = e.dk;
			if (q.pts < 3) return;
			q.pts = 0;
			q.mult = 1;
			q.run = 0;
			q.gap = 0;
			if (e.isMe) {
				e.msg = why;
				e.msgT = W.t;
				sfx("loss");
				W.shake = 0.25;
			}
		},
		rules(W, e, dt) {
			if (e.d) return;
			const q = e.dk;
			if (e.bonk) {
				e.bonk = 0;
				this.lose(W, e, "Crashed! Combo lost");
			}
			const on = e.slip > 0.3 && e.spd > 6,
				zn = on && this.zone(e.x, e.z);
			if (on) {
				if (e.isMe && !q.pts) sfx("skid");
				q.gap = 0;
				q.run += dt;
				q.pts += e.spd * Math.min(1, e.slip / 0.9) * dt * 2.2 * (zn ? 2 : 1);
				q.mult = Math.min(5, 1 + Math.floor(q.run / 1.6));
			} else if (q.pts > 0) {
				q.gap += dt;
				if (q.gap > 0.8) this.bank(W, e);
			}
			e.f.cb = Math.round(q.pts * q.mult);
			e.f.m = q.mult;
			e.zn = zn;
		},
		timeUp(W, e) {
			this.bank(W, e);
		},
		onRammed(W, e, by) {
			const q = e.dk,
				v = Math.round(q.pts * q.mult),
				thief = by && by !== e && v >= 3 ? by : null;
			this.lose(
				W,
				e,
				thief ? `Rammed! ${thief.isMe && !W.tv ? "You" : thief.p.name} stole ${v}` : "Rammed! Combo lost",
			);
			if (!thief) return;
			if (thief.local) this.steal(W, thief, v, e);
			else {
				e.stN++;
				e.f.st = (e.f.st || []).concat([[thief.k, v, e.stN]]).slice(-8);
			}
		},
		steal(W, by, v, from) {
			by.sc += v;

		spawn(W, i, n) {

		phys(W, e, inp, dt) {

					e.dch = 0;
				} else {
					let dv = 0;

					}
					const k = Math.max(0, Math.min(1, 0.5 + (e.dr * dv) / 1.1)),
						ease = 0.4 + 0.6 * Math.min(1, e.dch / 0.35);

		rules(W, e, dt) {
			if (e.d) return;
			const { N, L, ds } = this.trk();
			if (e.pi !== undefined) {
				if (e.pi > N * 0.85 && e.si < N * 0.15) e.lap++;
				else if (e.pi < N * 0.15 && e.si > N * 0.85) e.lap--;
			}
			e.pi = e.si;
			e.f.dl = e.dr ? this.lvl(e.dch) + 1 : 0;
			if (e.boostT <= 0) e.f.bl = 0;
			{
				const fx = Math.cos(e.yaw),
					fz = -Math.sin(e.yaw);
				let behind = false;
				if (e.spd > 9 && e.boostT <= 0)
					for (const o of W.list) {
						if (o === e || o.gone || Math.abs((o.y || 0) - (e.y || 0)) > 1.6) continue;
						const dx = o.x - e.x,
							dz = o.z - e.z,
							dd = Math.hypot(dx, dz);
						if (dd < 2.2 || dd > 9) continue;
						if ((dx * fx + dz * fz) / dd > 0.95) {
							behind = true;
							break;
						}
					}
				e.drf = behind ? (e.drf || 0) + dt : Math.max(0, (e.drf || 0) - dt * 1.5);
				if (e.drf >= 1.2) {
					e.drf = 0;
					e.boostT = 1;
					e.f.bl = 4;
					e.vx += fx * 4;
					e.vz += fz * 4;
					if (e.isMe) {
						sfx("go");
						W.shake = 0.12;
					}
				}
				e.f.sl = e.drf > 0.12 ? Math.round((e.drf / 1.2) * 10) / 10 : 0;
			}
			const prog = (e.lap - 1) * L + e.si * ds;
			e.sc = Math.max(0, Math.round(prog));
			e.f.lap = e.lap;
			if (e.lap > this.LAPS) {
				e.sc = Math.round(this.LAPS * L) + Math.round((this.dur - W.t) * 20);
				e.fin = W.t;
				e.f.fin = W.t;
				e.d = true;
				if (e.isMe) {
					const pl = this.place(W, e);
					e.msg = pl === 1 ? "WINNER!" : `Finished P${pl}!`;
					e.msgT = W.t;
					sfx(pl === 1 ? "fanfare" : "coin");
				}
			}
		},
		place(W, e) {
			return (
				1 +
				W.list.filter(
					(o) =>
						o !== e &&
						!o.gone &&
						(o.f && o.f.fin !== undefined && e.f && e.f.fin !== undefined ? o.f.fin < e.f.fin : o.sc > e.sc),

	tc.setMode(ED.mode);
	tc.setSpace(node && rot ? "world" : ED.space);
	tc.showX = tc.showZ = !(node && rot);
	tc.showY = true;
	tc.setTranslationSnap(ED.snap ? 0.25 : null);
	tc.setRotationSnap(ED.snap ? Math.PI / 12 : null);
	tc.setScaleSnap(ED.snap ? 0.05 : null);
}
function edPick(e) {
	const cv = $("#gl"),
		r = cv.getBoundingClientRect(),
		v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, (-(e.clientY - r.top) / r.height) * 2 + 1),
		rc = new THREE.Raycaster();
	rc.setFromCamera(v, ED.cam);
	rc.camera = ED.cam;
	const hits = rc.intersectObjects(
		ED.bd.scene.children.filter((o) => o !== ED.tc && o !== ED.proxy && o !== ED.cam),
		true,
	);
	for (const h of hits) {
		let vis = true,
			key = null,
			stop = false;
		for (let q = h.object; q; q = q.parent) {
			if (q.visible === false) vis = false;
			if (q.userData.edStop) stop = true;
			if (!key && q.userData.edId) key = "o:" + q.userData.edId;
			if (!key && q.userData.node !== undefined) key = "n:" + q.userData.node;
		}
		if (!vis) continue;
		if (key) {
			edSelect(key);
			return;
		}
		if (stop) break;
	}
	edSelect(null);
}
/* live preview while dragging the gizmo */
function edLive() {
	const k = ED.sel;
	if (!k) return;
	if (k[0] === "n") {
		const i = +k.slice(2),
			n = ED.map.nodes[i],
			ng = ED.bd.nodeG[i],
			tl = ng.userData.tl,
			p = ED.proxy;
		if (ED.mode === "scale") {
			const s0 = ED.s0 || 1,
				s = [p.scale.x, p.scale.y, p.scale.z].reduce((a, b) => (Math.abs(b - s0) > Math.abs(a - s0) ? b : a));
			p.scale.setScalar(Math.max(0.2, s));
		}
		ng.position.set(p.position.x - n.x, p.position.y, p.position.z - n.z);
		tl.rotation.y = p.rotation.y;
		tl.scale.setScalar(p.scale.x * ep("tileR"));
	}
	edSelVals();
}
function edCommit() {
	const k = ED.sel;
	if (!k) return;
	const e = edMine(ED.id);
	ED.undo.push(JSON.stringify(e));
	if (ED.undo.length > 80) ED.undo.shift();
	if (k[0] === "n") {
		const i = +k.slice(2),
			p = ED.proxy,
			tl = ED.bd.nodeG[i].userData.tl;
		e.n[i] = {
			x: r3(p.position.x),
			y: r3(p.position.y),
			z: r3(p.position.z),
			r: r3(wrapA(p.rotation.y - tl.userData.auto)),
			s: r3(p.scale.x),
		};
		edPut(ED.id, e);
		edBuild();
	} else {
		const id = k.slice(2),
			o = ED.bd.reg[id];
		e.o[id] = {
			p: o.position.toArray().map(r3),
			r: [o.rotation.x, o.rotation.y, o.rotation.z].map(r3),
			s: o.scale.toArray().map(r3),
		};
		edPut(ED.id, e);
		edSelInfo();
	}
}
function edUndo() {
	const u = ED.undo.pop();
	if (!u) {
		edMsg("Nothing to undo");
		return;
	}
	edPut(ED.id, JSON.parse(u));
	edBuild();
	edPanel();
}
function edResetSel() {
	const k = ED.sel;
	if (!k) return;
	const e = edMine(ED.id),
		id = k.slice(2),
		tbl = k[0] === "n" ? e.n : e.o;
	if (!tbl[id]) {
		edMsg("You haven't edited this one");
		return;
	}
	ED.undo.push(JSON.stringify(e));
	delete tbl[id];
	edPut(ED.id, e);
	edBuild();
}
function edFocus() {
	const o = ED.sel && (ED.sel[0] === "n" ? ED.proxy : edTarget(ED.sel));
	if (!o) return;
	const p = o.getWorldPosition(new THREE.Vector3()),
		d = ED.cam.position.clone().sub(ED.orbit.target);
	ED.orbit.target.copy(p);
	ED.cam.position.copy(p).add(d.setLength(Math.min(d.length(), 22)));
}
function edMsg(t) {
	const m = $("#edmsg");
	if (m) m.innerHTML = t;
	clearTimeout(ED.msgT);
	if (t)
		ED.msgT = setTimeout(() => {
			const q = $("#edmsg");
			if (q && q.innerHTML === t) q.innerHTML = "";
		}, 6000);
}
function edKey(e) {
	if (!ED) return;
	if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) {
		if (e.key === "Escape" || e.key === "Enter") e.target.blur();
		return;
	}
	const k = e.key.toLowerCase();
	e.stopPropagation();
	if (!ED.tc) return;
	if ((e.ctrlKey || e.metaKey) && k === "z") {
		e.preventDefault();
		edUndo();
		return;
	}
	if (e.ctrlKey || e.metaKey || e.altKey) return;
	if (k === "w" || k === "e" || k === "r") {
		ED.mode = { w: "translate", e: "rotate", r: "scale" }[k];
		edGizmo();
		edPanel();
	} else if (k === "q") {
		ED.space = ED.space === "world" ? "local" : "world";
		edGizmo();
		edPanel();
	} else if (k === "x") {
		ED.snap = !ED.snap;
		edGizmo();
		edPanel();
	} else if (k === "f") edFocus();
	else if (k === "escape") edSelect(null);
	else if (k === "delete" || k === "backspace") edResetSel();
}
function edCopy() {
	const m = mapEdits(ED.map),
		out = { map: ED.id, p: m.p, n: m.n, o: m.o },
		txt = JSON.stringify(out);
	const show = () =>
		edMsg(
			`Copy this and paste it to Claude:<br><textarea readonly style="width:100%;height:90px;margin-top:6px;background:#0F141B;color:#EEF2F7;border:1px solid #3B475A;border-radius:6px" onclick="this.select()">${esc(txt)}</textarea>`,
		);
	try {
		navigator.clipboard
			.writeText(txt)
			.then(
				() =>
					edMsg(
						`Copied ${Object.keys(m.n).length} spaces, ${Object.keys(m.o).length} props and ${Object.keys(m.p).length} shape values. Paste them to Claude to make them permanent.`,
					),
				show,
			);
	} catch (x) {
		show();
	}
}
/* ---------- panel ---------- */
function edPanel() {
	if (!ED || !ED.tc) return;
	const m = ED.map,
		b = (on, a, t) => `<button data-ed="${a}" class="${on ? "on" : ""}">${t}</button>`;
	ED.box.innerHTML = `<div class="edtop"><b>🛠 Map editor</b><select data-edk="map">${Object.values(MAPS)
		.map((q) => `<option value="${q.id}" ${q.id === ED.id ? "selected" : ""}>${esc(q.name)}</option>`)
		.join("")}</select>
    ${b(ED.mode === "translate", "m:translate", "Move (W)")}${b(ED.mode === "rotate", "m:rotate", "Rotate (E)")}${b(ED.mode === "scale", "m:scale", "Scale (R)")}
    ${b(ED.space === "local", "space", ED.space === "local" ? "Local (Q)" : "World (Q)")}${b(ED.snap, "snap", "Snap (X)")}
    <button data-ed="undo">↶ Undo</button><button data-ed="copy">📋 Copy edits</button><button data-ed="close">✕ Close</button></div>
  <div class="edside"><div id="edsel"></div>
    <h3>Shape</h3>${ED_PARAMS.filter((q) => !q[6] || m.lava)
			.map(
				([k, nm, lo, hi, st]) =>
					`<label class="edsl">${nm} <span id="edv-${k}">${+ep(k).toFixed(3)}</span><input type="range" data-edp="${k}" min="${lo}" max="${hi}" step="${st}" value="${ep(k)}"></label>`,
			)
			.join("")}
    ${m.lava ? `<h3>Lava preview</h3><div class="edrow">${["Low", "Rising", "High"].map((t, i) => b(ED.lv === i, "lv:" + i, t)).join("")}</div>` : ""}
    <p class="ednote">Click a space or a prop to select it. Left drag orbits, right drag pans, wheel zooms. W/E/R move, rotate, scale · Q world/local · X snap · F focus · Del resets the selection · Ctrl+Z undo. Shape changes rebuild the board.</p>
    <button data-ed="resetall" style="width:100%">Reset all my edits on this map</button></div>
  <div class="edmsg" id="edmsg"></div>`;
	edSelInfo();
}
function edSelInfo() {
	const el = $("#edsel");
	if (!el) return;
	const k = ED.sel;
	if (!k) {
		el.innerHTML = `<h3>Selection</h3><p class="ednote">Nothing selected.</p>`;
		return;
	}
	const node = k[0] === "n",
		id = k.slice(2),
		mine = node ? edMine(ED.id).n[id] : edMine(ED.id).o[id];
	const nm = node ? `Space ${id} · ${edTypeName(ED.map.nodes[+id].t)}` : `Prop · ${esc(id)}`,
		f = (q, l) =>
			`<label>${l}<input type="number" step="${q === "r" ? 5 : q === "s" ? 0.05 : 0.1}" data-edf="${q}" id="edf-${q}"></label>`;
	el.innerHTML = `<h3>Selection</h3><div style="margin-bottom:6px"><b>${nm}</b>${mine ? ` <span style="color:#FFC83D">· edited</span>` : ""}</div>
    <div class="edrow">${f("x", "X")}${f("y", "Y")}${f("z", "Z")}</div><div class="edrow">${f("r", "Turn °")}${f("s", "Scale")}<label>&nbsp;<button data-ed="resetsel" style="width:100%">Reset</button></label></div>`;
	edSelVals();
}
function edSelVals() {
	const k = ED.sel;
	if (!k) return;
	const o = k[0] === "n" ? ED.proxy : edTarget(k);
	if (!o) return;
	const v = { x: o.position.x, y: o.position.y, z: o.position.z, r: (o.rotation.y * 180) / Math.PI, s: o.scale.x };
	Object.keys(v).forEach((q) => {
		const i = $("#edf-" + q);
		if (i && document.activeElement !== i) i.value = +v[q].toFixed(q === "r" ? 1 : 3);
	});
}
function edClick(e) {
	const b = e.target.closest("button[data-ed]");
	if (!b || !ED) return;
	const a = b.dataset.ed;
	if (a === "close") closeEditor();
	else if (!ED.tc) return;
	else if (a.startsWith("m:")) {
		ED.mode = a.slice(2);
		edGizmo();
		edPanel();
	} else if (a === "space") {
		ED.space = ED.space === "world" ? "local" : "world";
		edGizmo();
		edPanel();
	} else if (a === "snap") {
		ED.snap = !ED.snap;
		edGizmo();
		edPanel();
	} else if (a === "undo") edUndo();
	else if (a === "copy") edCopy();
	else if (a.startsWith("lv:")) {
		ED.lv = +a.slice(3);
		edPanel();
	} else if (a === "resetsel") edResetSel();
	else if (a === "resetall") {
		if (!b.dataset.sure) {
			b.dataset.sure = 1;
			b.textContent = "Click again to reset everything";
			b.classList.add("on");
			return;
		}
		ED.undo.push(JSON.stringify(edMine(ED.id)));
		edPut(ED.id, { p: {}, n: {}, o: {} });
		edBuild();
		edPanel();
	}
}
function edInput(e) {
	const k = e.target.dataset.edp;
	if (!k || !ED) return;
	const v = +e.target.value,
		sp = $("#edv-" + k);
	if (sp) sp.textContent = +v.toFixed(3);
	clearTimeout(ED.slT);
	ED.slT = setTimeout(() => {
		if (!ED) return;
		const ed = edMine(ED.id);
		ED.undo.push(JSON.stringify(ed));
		ed.p[k] = v;
		edPut(ED.id, ed);
		edBuild();
	}, 250);
}
function edChange(e) {
	const t = e.target;
	if (!ED || !ED.tc) return;
	if (t.dataset.edk === "map") {
		ED.id = t.value;
		LS.set("trp_edmap", ED.id);
		ED.undo = [];
		ED.sel = null;
		edBuild(true);
		edPanel();
		return;
	}
	const q = t.dataset.edf;
	if (!q || !ED.sel) return;
	const o = ED.sel[0] === "n" ? ED.proxy : edTarget(ED.sel),
		v = +t.value;
	if (!o || !isFinite(v)) return;
	if (q === "r") o.rotation.y = (v * Math.PI) / 180;
	else if (q === "s") o.scale.setScalar(Math.max(0.05, v));
	else o.position[q] = v;
	edLive();
	edCommit();
}
/* ---------- events ---------- */
document.addEventListener("input", (e) => {
	if (e.target.id === "jcode") pendingCode = e.target.value.toUpperCase().replace(/[^A-Z]/g, "");
	if (e.target.id === "nm") {
		me.name = e.target.value.slice(0, 12);
		saveMe();
		setPresence({ here: { name: me.name || "Driver" } });
	}
});
function pickTruck(i) {
	me.truck = (i + TRUCKS.length) % TRUCKS.length;
	saveMe();
	document.querySelectorAll(".tc").forEach((x) => {
		const on = +x.dataset.t === me.truck;
		x.classList.toggle("sel", on);
		x.setAttribute("aria-pressed", on);
	});
	const sel = document.querySelector(".tc.sel");
	if (sel) sel.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
	const sn = $("#shown");
	if (sn) sn.innerHTML = showNameHTML(me.truck);
	if (GFX.ok && (view === "home" || view === "join")) setShowroom([me.truck]);
	if (role === "client") setPresence({ me: { key: me.key, name: me.name || "Driver", truck: me.truck } });
	if (role === "host" && HG && HG.phase === "lobby") {
		const p = pByKey(me.key);
		if (p) {
			p.truck = me.truck;
			push();
		}
	}
}
document.addEventListener("click", (e) => {
	const b = e.target.closest("button");
	if (!b) return;
	if (b.dataset.t !== undefined) {
		pickTruck(+b.dataset.t);
		return;
	}
	if (b.dataset.step) {
		pickTruck(me.truck + +b.dataset.step);
		return;
	}
	if (b.dataset.tvprac) {
		if (role === "host" && HG && HG.tv) tvPractice(b.dataset.tvprac);
		else if (role === "client") act({ t: "prac", g: b.dataset.tvprac });
		return;
	}
	if (b.dataset.join) {
		if (!me.name) {
			me.name = "Driver";
			saveMe();
		}
		clientJoin(b.dataset.join);
		return;
	}
	if (b.dataset.kick && role === "host") {
		HG.players = HG.players.filter((p) => p.key !== b.dataset.kick);
		if (!HG.kick.includes(b.dataset.kick)) HG.kick.push(b.dataset.kick);
		push();
		return;
	}
	if (b.dataset.rounds && role === "host") {
		HG.rounds = +b.dataset.rounds;
		push();
		return;
	}
	if (b.dataset.roll) {
		if (!G) return;
		b.disabled = true;
		act({ t: "roll", die: b.dataset.roll, seq: G.seq }, b.dataset.for || me.key);
		unstick();
		return;
	}
	if (b.dataset.buy) {
		if (!G) return;
		b.disabled = true;
		act({ t: "buy", yes: b.dataset.buy === "1", how: b.dataset.how, seq: G.seq }, b.dataset.for || me.key);
		unstick();
		return;
	}
	const a = b.dataset.a;
	if (a === "host") {
		notice = "";
		LS.del("trp_host");
		if (!me.name) {
			me.name = "Driver";
			saveMe();
		}
		hostCreate();
	} else if (a === "resume") {
		notice = "";
		hostResume(LS.get("trp_host", null));
	} else if (a === "joinlist") {
		notice = "";
		homeSub = "join";
		render();
	} else if (a === "connect") {
		const c = (($("#jcode") || {}).value || "").toUpperCase().replace(/[^A-Z]/g, "");
		if (c) {
			pendingCode = c;
			const g = NET.status === "connected" && NET.code === c && gamesAvailable()[0];
			if (g) {
				if (!me.name) {
					me.name = "Driver";
					saveMe();
				}
				clientJoin(g.id);
			} else {
				NET.join(c);
				render.last = null;
				render();
			}
		}
	} else if (a === "home") {
		homeSub = "main";
		render();
	} else if (a === "addcpu" && role === "host") addCpu();
	else if (a === "tbtip") {
		LS.set("trp_tbtip", true);
		render.last = null;
		render();
	} else if (a === "hosttv") {
		notice = "";
		LS.del("trp_host");
		hostCreate(true);
	} else if (a === "tvstart" && role === "client") act({ t: "start" });
	else if (a === "tvcpu" && role === "client") act({ t: "addcpu" });
	else if (a === "addlocal") {
		localForm = !localForm;
		render.last = null;
		render();
	} else if (a === "addlocalok" && role === "host" && HG.players.length < 8) {
		const nm = ($("#lname").value || "").trim() || `Player ${HG.players.length + 1}`;
		HG.players.push(newPlayer(rid(), nm, +$("#ltruck").value, false, true));
		localForm = false;
		push();
	} else if (a === "start" && role === "host") hostStart();
	else if (a === "quit") hostQuit();
	else if (a === "again") hostPlayAgain();
	else if (a === "endask") {
		if (confirm("End this game for everyone?")) hostQuit();
	} else if (a === "leave") {
		if (role === "client") clientLeave();
		else {
			role = "none";
			render();
		}
	} else if (a === "changetruck") {
		changingTruck = !changingTruck;
		render.last = null;
		render();
	} else if (a === "replaypod") replayPodium();
	else if (a === "peek") togglePeek();
	else if (a === "cam") {
		GFX.follow = !GFX.follow;
		GFX.ov = null;
		if (!GFX.follow) camHint();
		updateGame();
	}
});
function unstick() {
	setTimeout(() => {
		render.lastPanel = null;
		if (view === "game" && G) updateGame();
	}, 3000);
}

/* ---------- boot ---------- */
setInterval(() => {
	if (W && GFX.mode === "mg" && (document.hidden || performance.now() - lastT > 400)) {
		if (TVS) {
			try {
				tvsFrame();
			} catch (e) {
				console.error(e);
			}
			return;
		}
		try {
			for (let i = 0; i < 3 && W; i++) stepMG(0.033);
			GFX.mgLast = performance.now();
		} catch (e) {}
	}
}, 100);
gfxInit();
render();
setInterval(() => {
	if (view === "game" && role === "client") updateGame();
	if (view === "join") render();
}, 2000);
(async () => {
	if (!NET.ok) {
		roomState = "none";
		render.last = null;
		render();
		return;
	}
	room = NET.lobby();
	NET.onchange = () => {
		render.last = null;
		render();
	};
	roomState = "ok";
	room.onConnection(
		(c) => {
			roomConnected = !!c;
			render.last = null;
			render();
		},
		() => {
			roomConnected = false;
			render.last = null;
			render();
		},
	);
	room.onPeers(
		(ch) => {
			peers = ch.peers || [];
			if (role === "host") hostOnPeers();
			else if (role === "client") clientOnPeers();
			else render();
		},
		(err) => {
			room = null;
			roomState = "none";
			render.last = null;
			render();
		},
	);
	setPresence({ here: { name: me.name || "Driver" } });
	const jc = (new URLSearchParams(location.search).get("join") || "")
		.toUpperCase()
		.replace(/[^A-Z]/g, "")
		.slice(0, 6);
	if (jc) {
		pendingCode = jc;
		notice = `You're joining game ${jc}. Pick your name and truck, then tap Join Game.`;
		NET.join(jc);
	}
	render.last = null;
	render();
})();
</script>
